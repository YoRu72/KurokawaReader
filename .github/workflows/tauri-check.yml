name: Tauri check

# The Tauri shell of Kurokawa Tools (apps/tools/desktop-tauri, stage 2) built on Windows, Linux and macOS beside the
# Electron one, to see that it builds, how big its bundles are, and that it runs: the built app is started with
# KT_SELFTEST set and checks its own bridge, files, http and download engine against a loopback test server
# (desktop-tauri/selftest.js). Linux and Windows must pass; macOS is reported without failing the job for now.
# Nothing is signed or released.
on:
  push:
    branches: ['work-tauri*']
    paths:
      - 'apps/tools/desktop-tauri/**'
      - 'apps/tools/src/**'
      - '.github/workflows/tauri-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04, bundles: 'appimage,deb', target: '' }
          - { name: Windows, os: windows-latest, bundles: 'nsis', target: '' }
          - { name: macOS, os: macos-latest, bundles: 'dmg', target: '' }
          - { name: macOS universal, os: macos-latest, bundles: 'dmg', target: 'universal-apple-darwin' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Web UI
        working-directory: apps/tools
        run: |
          for i in 1 2 3; do npm install && break; [ $i = 3 ] && exit 1; echo "npm install failed; again in 20 s"; sleep 20; done
          node scripts/build.mjs
          node tests/tauribridge.cjs

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev file xvfb xauth at-spi2-core dbus-x11

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/tools/desktop-tauri/src-tauri -> target'
          key: ${{ matrix.target }}

      # aria2c as the Electron build gets it (desktop/fetch-aria2.mjs → desktop/aria2/<plat>-<arch>/; none for macOS),
      # copied into desktop-tauri/aria2/, which tauri.conf.json bundles as resources/aria2/.
      - name: aria2c for the bundle
        working-directory: apps/tools/desktop
        run: |
          node fetch-aria2.mjs
          mkdir -p aria2 ../desktop-tauri/aria2
          for d in aria2/*/; do [ -d "$d" ] && cp -R "${d%/}" ../desktop-tauri/aria2/; done
          find ../desktop-tauri/aria2 -type f -exec ls -la {} \;

      - name: Icons (from desktop/icon.png)
        working-directory: apps/tools/desktop-tauri
        run: |
          npx --yes @tauri-apps/cli@^2 icon ../desktop/icon.png
          ls -la src-tauri/icons

      - name: Build
        working-directory: apps/tools/desktop-tauri
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
          else
            npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }}
          fi

      - name: Sizes
        working-directory: apps/tools/desktop-tauri/src-tauri
        run: |
          {
            echo "### ${{ matrix.name }} — Tauri bundles"
            echo ""
            echo "| File | Size (MB) |"
            echo "|---|---:|"
            find target -path '*/release/bundle/*' -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) | sort | while read -r f; do
              b=$(wc -c < "$f" | tr -d ' ')
              echo "| \`$f\` | $(awk -v b="$b" 'BEGIN { printf "%.2f", b / 1048576 }') |"
            done
            find target -maxdepth 3 -path '*/release/*' -type f \( -name 'kurokawa-tools' -o -name 'kurokawa-tools.exe' \) | sort | while read -r f; do
              b=$(wc -c < "$f" | tr -d ' ')
              echo "| \`$f\` (bare executable) | $(awk -v b="$b" 'BEGIN { printf "%.2f", b / 1048576 }') |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            apps/tools/desktop-tauri/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/tools/desktop-tauri/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/tools/desktop-tauri/src-tauri/target/**/release/bundle/deb/*.deb
            apps/tools/desktop-tauri/src-tauri/target/**/release/bundle/dmg/*.dmg

      # The runtime self-test: the built app started with KT_SELFTEST=<file>; it writes its results there and exits
      # 0 (all required checks passed), 1 (one failed) or 2 (its own watchdog, KT_SELFTEST_TIMEOUT seconds).
      - name: Self-test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        working-directory: apps/tools/desktop-tauri/src-tauri
        env:
          KT_SELFTEST_TIMEOUT: '100'
          KT_SELFTEST_BUNDLED: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          NO_AT_BRIDGE: '1'
        run: |
          out="$RUNNER_TEMP/kt-selftest.json"
          find target/release/aria2 -type f -exec ls -la {} \; || echo "no aria2/ beside the executable"
          set +e
          KT_SELFTEST="$out" timeout 150 xvfb-run -a -s '-screen 0 1280x900x24' ./target/release/kurokawa-tools
          code=$?
          set -e
          node ../selftest-report.cjs "$out" "$code" "${{ matrix.name }}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/tools/desktop-tauri/src-tauri
        env:
          KT_SELFTEST_TIMEOUT: '100'
          KT_SELFTEST_BUNDLED: '1'
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'kt-selftest.json'
          $env:KT_SELFTEST = $out
          if (Test-Path 'target/release/aria2') { Get-ChildItem 'target/release/aria2' -Recurse -File | Format-Table FullName, Length } else { 'no aria2/ beside the executable' }
          $exe = (Resolve-Path 'target/release/kurokawa-tools.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          $null = $p.Handle
          if ($p.WaitForExit(150000)) { $code = $p.ExitCode } else { Stop-Process -Id $p.Id -Force; $code = 124 }
          node ../selftest-report.cjs $out $code '${{ matrix.name }}' | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $code

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: apps/tools/desktop-tauri/src-tauri
        env:
          KT_SELFTEST_TIMEOUT: '100'
        run: |
          out="$RUNNER_TEMP/kt-selftest.json"
          # (The bare executable, as on Linux: the web UI is built into it; macOS bundles no aria2c.)
          if [ -n "${{ matrix.target }}" ]; then bin="target/${{ matrix.target }}/release/kurokawa-tools"; else bin="target/release/kurokawa-tools"; fi
          [ -x "$bin" ] || { echo "no executable at $bin"; exit 1; }
          echo "running $bin"
          set +e
          # (No `timeout` on macOS: perl's alarm ends it after 150 s.)
          KT_SELFTEST="$out" perl -e 'alarm 150; exec @ARGV' "$bin"
          code=$?
          set -e
          node ../selftest-report.cjs "$out" "$code" "${{ matrix.name }}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code
