name: Preflight

# One run that tells a work branch is ready for the final push, so release day is boring. It costs little on an
# ordinary push and is complete when you ask for it:
#   · a push to a work-* branch (apps/**, shared/**, repo/** or the preflight itself): the QUICK preflight on Linux
#     (build, type check, string parity, version and notes, budgets, the tests the diff touches and a smoke set), and the
#     Android compile check of the app when the branch changes what the APK is made from;
#   · the FULL preflight (every test of the release workflow), the Tauri checks (Windows, Linux and macOS, runtime
#     self-test included) and, for Tools, the Rust core for Android: by hand (Actions → Preflight → Run workflow, app
#     tools, reader or all), or on a push whose head commit message contains «[full]».
# The tests of an app are split over parallel machines (shards: scripts/preflight.mjs --shard i/n, split by the measured
# seconds in scripts/preflight.timings.json: 4 per app on a full run, 1 or 2 on a quick one). The job «Preflight verdict»
# waits for every shard, merges their results into ONE table in the run's summary, and is the single result to look at (and
# to require). A quick run (no «[full]») chooses its tests by what THIS push changed (the last push, plus the smoke set); a new
# branch, a forced history, «[full]» and a manual run choose as before. Every shard keeps the whole output of each failing or
# flaky test and the tests' pictures as an artifact (7 days). The release workflows look for a green FULL verdict of the same
# files (scripts/find-green-preflight.mjs) and then do not repeat the long chain.
# A newer push cancels the older run of the same branch. Nothing here publishes, tags or releases anything, and no
# secret is used (the check workflows sign with a throw-away key). docs/RELEASING.md says how to read the result.
#
# (The checks that already have a push trigger of their own — the Android checks on work-* when their own paths change,
# the Tauri checks on work-tauri* / work-reader-tauri*, the Rust-for-Android check on three named branches — are not
# started a second time by the same push: «plan» leaves them out when their own trigger fires.)
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app'
        type: choice
        options: [all, tools, reader]
        default: all
      quick:
        description: 'Quick preflight (build, tsc, budgets, parity, the tests the diff touches)'
        type: boolean
        default: false
      compile:
        description: 'Also compile the Android and Tauri sides (slow: the Tauri checks run on three systems)'
        type: boolean
        default: true
  push:
    branches: ['work-*']
    paths:
      - 'apps/**'
      - 'shared/**'
      - 'repo/**'
      - 'scripts/preflight.mjs'
      - 'scripts/preflight.config.json'
      - '.github/workflows/preflight.yml'

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.ref }}-${{ inputs.app || 'push' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.p.outputs.tools }}
      reader: ${{ steps.p.outputs.reader }}
      android_tools: ${{ steps.p.outputs.android_tools }}
      android_reader: ${{ steps.p.outputs.android_reader }}
      tauri_tools: ${{ steps.p.outputs.tauri_tools }}
      tauri_reader: ${{ steps.p.outputs.tauri_reader }}
      rust_android: ${{ steps.p.outputs.rust_android }}
      quick: ${{ steps.p.outputs.quick }}
      matrix: ${{ steps.m.outputs.matrix }}
      any: ${{ steps.m.outputs.any }}
      full_apps: ${{ steps.m.outputs.full_apps }}
      diff_from: ${{ steps.p.outputs.diff_from }}
      diff_note: ${{ steps.p.outputs.diff_note }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: p
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          APP: ${{ inputs.app }}
          COMPILE: ${{ inputs.compile }}
          REF: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          QUICK_IN: ${{ inputs.quick }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -u
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          if [ "$EVENT" = workflow_dispatch ]; then
            t=false; r=false
            case "$APP" in tools) t=true;; reader) r=true;; *) t=true; r=true;; esac
            c=$COMPILE
            out tools $t; out reader $r
            out quick $([ "$QUICK_IN" = true ] && echo true || echo false)
            out android_tools $([ $t = true ] && [ "$c" = true ] && echo true || echo false)
            out android_reader $([ $r = true ] && [ "$c" = true ] && echo true || echo false)
            out tauri_tools $([ $t = true ] && [ "$c" = true ] && echo true || echo false)
            out tauri_reader $([ $r = true ] && [ "$c" = true ] && echo true || echo false)
            out rust_android $([ $t = true ] && [ "$c" = true ] && echo true || echo false)
            out diff_from ''
            out diff_note 'started by hand'
            exit 0
          fi
          # A push: what the whole branch changes against main (so every later push of a branch that has native changes
          # compiles them again), and what this push alone changes (to leave out a check whose own trigger fires).
          git fetch --no-tags origin main || true
          base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1)
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/branch.txt"
          if echo "$BEFORE" | grep -qE '^0+$'; then cp "$RUNNER_TEMP/branch.txt" "$RUNNER_TEMP/push.txt"; else git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/push.txt" 2>/dev/null || cp "$RUNNER_TEMP/branch.txt" "$RUNNER_TEMP/push.txt"; fi
          # Which commit a QUICK run measures «what changed» from: the head the branch had before THIS push; a new branch, or a
          # forced push whose old head is not in the history any more, falls back to the whole branch's diff against main.
          since=''; note='new branch: the diff against main'
          if ! echo "$BEFORE" | grep -qE '^0+$'; then
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then since=$BEFORE; note='the files of this push'; else note='forced history (the old head is not an ancestor): the diff against main'; fi
          fi
          out diff_from "$since"
          out diff_note "$note"
          # Cheap by default: only a «[full]» in the head commit's message turns on the full preflight, the Tauri checks and the Rust core for Android.
          if printf '%s' "$HEAD_MSG" | grep -qF '[full]'; then full=true; else full=false; fi
          out quick $([ $full = true ] && echo false || echo true)
          has() { grep -qE "$2" "$1"; }
          tf() { if "$@"; then echo true; else echo false; fi; }
          B="$RUNNER_TEMP/branch.txt"; P="$RUNNER_TEMP/push.txt"
          out tools $(tf has "$B" '^(apps/tools/|shared/|repo/)')
          out reader $(tf has "$B" '^(apps/reader/|shared/|repo/)')
          # Java: the same paths android-check-<app>.yml watches; skipped when this push already started that workflow.
          at='^apps/tools/(native/android/|tests/native/|capacitor\.config|package\.json)'; ar='^apps/reader/(native/android/|capacitor\.config|package\.json)'
          if has "$B" "$at" && ! has "$P" "$at"; then out android_tools true; else out android_tools false; fi
          if has "$B" "$ar" && ! has "$P" "$ar"; then out android_reader true; else out android_reader false; fi
          # Rust: Tauri shells (and the crate they share); their own triggers are the work-tauri* / work-reader-tauri* branches.
          tt='^(apps/tools/(desktop-tauri|core)/|shared/shell-rs/)'; rt='^(apps/reader/desktop-tauri/|shared/shell-rs/)'
          if [ $full != true ]; then out tauri_tools false; else case "$REF" in work-tauri*) out tauri_tools false;; *) out tauri_tools $(tf has "$B" "$tt");; esac; fi
          if [ $full != true ]; then out tauri_reader false; else case "$REF" in work-reader-tauri*) out tauri_reader false;; *) out tauri_reader $(tf has "$B" "$rt");; esac; fi
          if [ $full != true ]; then out rust_android false; else case "$REF" in work-tt-p5|work-tauri|work-and-all) out rust_android false;; *) out rust_android $(tf has "$B" '^apps/tools/(core|native)/');; esac; fi
      # The shards: what each app's run plans (scripts/preflight.mjs --list, nothing is run), and how many machines that needs:
      # a full run 4 per app; a quick run 2 when its planned tests take more than 12 minutes, else 1.
      - id: m
        shell: bash
        env:
          TOOLS: ${{ steps.p.outputs.tools }}
          READER: ${{ steps.p.outputs.reader }}
          QUICK: ${{ steps.p.outputs.quick }}
          DIFF_FROM: ${{ steps.p.outputs.diff_from }}
          DIFF_NOTE: ${{ steps.p.outputs.diff_note }}
        run: |
          set -u
          include='[]'; apps=''
          for app in tools reader; do
            if [ "$app" = tools ]; then on=$TOOLS; else on=$READER; fi
            [ "$on" = true ] || continue
            args=("$app" --list)
            if [ "$QUICK" = true ]; then args+=(--quick); if [ -n "$DIFF_FROM" ]; then args+=(--diff-from "$DIFF_FROM"); fi; args+=(--diff-note "$DIFF_NOTE"); fi
            node scripts/preflight.mjs "${args[@]}" > "$RUNNER_TEMP/list-$app.json" || echo '{}' > "$RUNNER_TEMP/list-$app.json"
            total=$(node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));console.log(j.plannedSecTotal||0)" "$RUNNER_TEMP/list-$app.json")
            if [ "$QUICK" = true ]; then if [ "$total" -gt 720 ]; then n=2; else n=1; fi; else n=4; fi
            echo "$app: planned $((total/60)) min over $n shard(s)"
            include=$(node -e "const a=JSON.parse(process.argv[1]);for(let i=1;i<=+process.argv[3];i++)a.push({app:process.argv[2],shard:i,of:+process.argv[3]});console.log(JSON.stringify(a))" "$include" "$app" "$n")
            apps="$apps${apps:+,}$app"
          done
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$apps" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "full_apps=$([ "$QUICK" = true ] && echo none || echo "${apps:-none}")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT" | grep -E '^(matrix|any|full_apps)='

  preflight:
    name: Preflight ${{ matrix.app }} ${{ matrix.shard }}/${{ matrix.of }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    # (Each shard is a part of the run: about a quarter of a full run's tests, some 25 minutes; 75 leaves room for a slow
    # machine. Before the split one job did it all: 150 minutes were needed for a full Tools run.)
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # (As the release workflows do it: the app's own packages, then Playwright with its Chromium — tried again, then
      # without the system packages, because the runner's package server is sometimes unreachable.)
      - name: Install
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          npm install
          if [ "${{ matrix.app }}" = tools ]; then npm install --no-save playwright@1.64.1 ts-api@npm:typescript@6.0.3; (cd desktop && npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund); else npm install --no-save playwright@1.64.1 kuromoji@0.1.2 ts-api@npm:typescript@6.0.3; fi
          npx playwright@1.64.1 install --with-deps chromium || (sleep 30; npx playwright@1.64.1 install --with-deps chromium) || npx playwright@1.64.1 install chromium
      # (Tools, full runs only, once the scene engine is in the checkout: its wasm is built before the preflight builds the web app, so
      # that tests/scene.cjs and the start-up budget run on the real engine, as the release does. The guard is the action's file,
      # so a branch without the engine runs as before.)
      - name: Scene engine (wasm)
        if: matrix.app == 'tools' && needs.plan.outputs.quick != 'true' && hashFiles('.github/actions/scene-wasm/action.yml') != ''
        uses: ./.github/actions/scene-wasm
      # (Reader's smoke test reads fixtures that scripts/make-fixtures.py makes: Python modules the runner does not have.)
      - name: Python modules for the fixtures
        if: matrix.app == 'reader'
        run: pip install --quiet pillow python-docx openpyxl python-pptx reportlab
      - name: Preflight
        shell: bash
        env:
          QUICK: ${{ needs.plan.outputs.quick == 'true' && '--quick' || '' }}
          DIFF_FROM: ${{ needs.plan.outputs.quick == 'true' && needs.plan.outputs.diff_from || '' }}
          DIFF_NOTE: ${{ needs.plan.outputs.diff_note }}
          # (With the scene engine in the checkout a missing wasm is a failure here, as in the release, not a quiet fallback.)
          KT_SCENE_REQUIRED: ${{ matrix.app == 'tools' && needs.plan.outputs.quick != 'true' && hashFiles('.github/actions/scene-wasm/action.yml') != '' && '1' || '' }}
        run: |
          git fetch --no-tags origin main || true
          # (Pictures a few tests can save for a look afterwards, e.g. the Hydro wallpaper: kept in the artifact «logs-…».)
          export KT_SHOTS="$RUNNER_TEMP/shots" KR_SHOTS="$RUNNER_TEMP/shots"; mkdir -p "$KT_SHOTS" "$RUNNER_TEMP/pf-json" "$RUNNER_TEMP/preflight-logs"
          extra=(--diff-note "$DIFF_NOTE"); if [ -n "$DIFF_FROM" ]; then extra+=(--diff-from "$DIFF_FROM"); fi
          set +e
          node scripts/preflight.mjs ${{ matrix.app }} $QUICK --shard ${{ matrix.shard }}/${{ matrix.of }} "${extra[@]}" --retry --json "$RUNNER_TEMP/pf-json/preflight-${{ matrix.app }}-${{ matrix.shard }}.json" --logs-dir "$RUNNER_TEMP/preflight-logs" 2>&1 | tee "$RUNNER_TEMP/preflight.txt"
          code=${PIPESTATUS[0]}
          # (The one table is the verdict job's; a shard only says here, in a line, how it went.)
          echo "${{ matrix.app }} shard ${{ matrix.shard }}/${{ matrix.of }}: $([ $code = 0 ] && echo passed || echo FAILED) — $(grep -E '^  -- ' "$RUNNER_TEMP/preflight.txt" | tail -n 1)" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      # (The result of this shard, for the verdict job.)
      - name: Keep this shard's result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf-json-${{ matrix.app }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/pf-json
          if-no-files-found: ignore
          retention-days: 7
      # (Whole output of every failing or flaky test, the run's text, and the pictures the tests saved: the table keeps only a test's last lines.)
      - name: Keep the whole logs and the tests' pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.app }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/preflight-logs
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/preflight.txt
            apps/${{ matrix.app }}/tests/shots*
          if-no-files-found: ignore
          retention-days: 7

  # The one result of the run: waits for every shard (also a shard that failed or was cancelled), merges their results into one
  # table in the summary and fails when any row is a FAIL or a shard left no result. The job's name carries what the run
  # covered («full: reader,tools», or «full: none» for a quick run): the release workflows read it (find-green-preflight.mjs).
  verdict:
    name: "Preflight verdict [full: ${{ needs.plan.outputs.full_apps }}]"
    needs: [plan, preflight]
    # (Also when a shard failed; not when the whole run was cancelled by a newer push: then nobody wants a verdict.)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Plan did not finish
        if: needs.plan.result != 'success'
        run: |
          echo "::error::the plan job ended as ${{ needs.plan.result }}, so nothing was checked"
          exit 1
      - uses: actions/checkout@v4
        if: needs.plan.result == 'success' && needs.plan.outputs.any == 'true'
        with: { sparse-checkout: scripts, sparse-checkout-cone-mode: true }
      - uses: actions/download-artifact@v4
        if: needs.plan.result == 'success' && needs.plan.outputs.any == 'true'
        # (No result at all — every shard died before it wrote one — must reach the table below as «left no result», not stop here.)
        continue-on-error: true
        with:
          pattern: pf-json-*
          path: pf-json
      - name: One table
        if: needs.plan.result == 'success'
        shell: bash
        env:
          ANY: ${{ needs.plan.outputs.any }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          FULL: ${{ needs.plan.outputs.full_apps }}
          QUICK: ${{ needs.plan.outputs.quick }}
          NOTE: ${{ needs.plan.outputs.diff_note }}
        run: |
          if [ "$ANY" != true ]; then echo "### Preflight verdict: nothing to check (no app is part of this run)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          expect=$(node -e "console.log(JSON.stringify(JSON.parse(process.env.MATRIX).include))")
          set +e
          node scripts/preflight-verdict.mjs pf-json --expect "$expect" --title "Preflight verdict ($([ "$QUICK" = true ] && echo "quick: $NOTE" || echo "full: $FULL"))" > verdict.md
          code=$?
          cat verdict.md >> "$GITHUB_STEP_SUMMARY"; cat verdict.md
          exit $code

  android-tools:
    name: Android compile (Tools)
    needs: plan
    if: needs.plan.outputs.android_tools == 'true'
    uses: ./.github/workflows/android-check-tools.yml
  android-reader:
    name: Android compile (Reader)
    needs: plan
    if: needs.plan.outputs.android_reader == 'true'
    uses: ./.github/workflows/android-check-reader.yml
  tauri-tools:
    name: Tauri check (Tools)
    needs: plan
    if: needs.plan.outputs.tauri_tools == 'true'
    uses: ./.github/workflows/tauri-check.yml
  tauri-reader:
    name: Tauri check (Reader)
    needs: plan
    if: needs.plan.outputs.tauri_reader == 'true'
    uses: ./.github/workflows/tauri-check-reader.yml
  rust-android-tools:
    name: Rust core for Android (Tools)
    needs: plan
    if: needs.plan.outputs.rust_android == 'true'
    uses: ./.github/workflows/android-rust-check.yml
