[package]
name = "kurokawa-tools"
# (Not the app's version: Tauri takes that from tauri.conf.json, which reads apps/tools/package.json.)
version = "0.0.0"
description = "Kurokawa Tools — the Tauri shell"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

# (Stage P3: what both apps' shells share — files, dialogs, clipboard, web requests with their cookies and DNS over
# HTTPS, the update check, window state, hashes, the self-tests' frame and test server — comes from shared/shell-rs,
# with the versions it names; Tools' engine rules from apps/tools/core/kt-core (std only). Tools lists tauri and the
# three plugins itself: it registers the plugins, and Tauri's build reads their permissions from its direct
# dependencies.)
[dependencies]
kurokawa-shell = { path = "../../../../shared/shell-rs" }
kt-core = { path = "../../core/kt-core" }
# ("image-png", stage P6 part: a PNG read for the app icon of the user's choosing — the shared appicon.rs.)
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde_json = "1"
# (The self-test's digest of the test server's file; the same version as kurokawa-shell's, so one copy.)
sha2 = "0.10"
# (Stage P7: raw deflate for the archives' own ZIP reader and writer — archives.rs over the shared archive.rs. Pure Rust
# (miniz_oxide); already in the build through reqwest's gzip; the Reader's shell names it the same way.)
flate2 = "1"

# (Stage P3: the free space of a disk — statvfs; already in the build through Tauri.)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# (Stage P4: torrent streaming with librqbit — OFF. The main build never names librqbit, so it never even resolves it:
# an API or a version that moved can never break it, and aria2 streams meanwhile (src/stream_engine.rs). To build with
# it, make this feature `rqbit = ["dep:librqbit", "dep:tokio"]` and add at the end
#   [dependencies.librqbit]  version = "8", optional = true
#   [dependencies.tokio]     version = "1", optional = true, features = ["io-util", "time"]
# — what the non-required CI step «librqbit try» (tauri-check.yml, Linux) does before `cargo check --features rqbit`,
# printing the compiler's errors. librqbit: the BitTorrent engine with file streams that fetch the pieces under the
# reader first (std cannot be a BitTorrent client); several MB and tokio-based (tokio is already in the build through
# Tauri).)
[features]
rqbit = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
