name: Android Rust check (Tools)

# The Rust core for Android (docs/RUST-PORT.md §5, stages M0–M1; apps/tools/core/kt-android, ANDROID-PORT.md): the
# std-only rules tested with rustc alone; the library built for the computer and loaded by a plain JVM through the
# app's own Java door (KtCore) — the JNI call shape proven without an emulator, the download rules' cases answered
# alike by Java and Rust, the shadow mode counting no difference; the library built for arm64-v8a, armeabi-v7a and
# x86_64 with the runner's NDK and packed into a release APK signed with a throw-away key (no repository secret);
# each APK checked for its library; sizes in the job summary. Nothing here is released: release-tools.yml is not
# touched (its switch-over patch waits in apps/tools/core/kt-android/switch-over/). The APK without the library is
# what android-check-tools.yml builds on the same pushes.
# Stage M2 (the HTTP downloader): kt-core's httpdl.rs tested alone; tests/native/T.java's runs 1–19 run twice against
# their loopback server — once through Java's KrDownloader (the reference, unchanged) and once through KrDownloaderRs,
# every decision asked of the host library (jvmtest/downloader-rust.sh, strict: no silent Java fallback).
# Stage M4 (the screen translator and HLS): kt-core's screentrack / screenmotion / inpaint / lettering / hls tested alone;
# Java's screen and HLS tests run under shadow mode and through the Rust engine (jvmtest/screen-rust.sh, strict), the
# parity cases, the host benchmark printed, and Java alone with no library.
# Stage M5 (the Files jobs): kt-core's fileplan / filejournal / remoterules tested alone; FilesT.java's cases through
# Java's planner and through Rust's (jvmtest/filejobs-rust.sh), the two planners compared on random trees, the journal
# killed before each of its records and resumed or rolled back.
on:
  # (Also called by preflight.yml, which runs it on a work branch before the final push.)
  workflow_call:
  push:
    branches: ['work-tt-p5', 'work-tauri', 'work-and-all']
    paths:
      - 'apps/tools/core/**'
      - 'apps/tools/native/**'
      - 'apps/tools/tests/native/**'
      - 'apps/tools/android/**'
      - '.github/workflows/android-rust-check.yml'
      - '.github/actions/json-jar/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-rust:
    name: Rust core for Android
    runs-on: ubuntu-latest
    timeout-minutes: 100   # (stage M3: librqbit built four times — the computer and three ABIs — with LTO; was 50)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: ./.github/actions/json-jar

      - name: Rust (stable) with the three Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          rustc --version; cargo --version

      - name: Std-only unit tests (rustc alone)
        run: |
          d="$RUNNER_TEMP/rs-tests"; mkdir -p "$d"
          for f in apps/tools/core/kt-core/src/dlrules.rs apps/tools/core/kt-core/src/translatekey.rs apps/tools/core/kt-core/src/vidjson.rs apps/tools/core/kt-core/src/httpdl.rs apps/tools/core/kt-core/src/mega.rs; do
            n=$(basename "$f" .rs); rustc --edition 2021 --test "$f" -o "$d/$n"; "$d/$n"
          done

      - name: kt-android's dispatch tests (cargo; kt-core by path, no crates.io crate)
        working-directory: apps/tools/core/kt-android
        run: cargo test --locked

      - name: Java's own rule tests (the reference, unchanged; no library here)
        working-directory: apps/tools
        run: sh tests/native/dlrules.sh && sh tests/native/screen.sh

      - name: Java's downloader, runs 1–19 (the reference engine, unchanged)
        working-directory: apps/tools
        run: sh tests/native/downloader.sh

      - name: The JNI door from a plain JVM (host build of the library)
        working-directory: apps/tools/core/kt-android
        run: |
          cargo build --release --locked
          ls -la target/release/libkt_android.so
          sh jvmtest/run.sh target/release/libkt_android.so

      - name: The same runs 1–19 through the Rust engine (M2; host library, strict)
        working-directory: apps/tools/core/kt-android
        run: sh jvmtest/downloader-rust.sh target/release/libkt_android.so

      # ---- stage M4: the screen translator and HLS (required) ----
      - name: M4 — std-only unit tests of the screen translator's and HLS's rules (rustc alone)
        run: |
          d="$RUNNER_TEMP/rs-tests-m4"; mkdir -p "$d"
          for f in screentrack screenmotion inpaint lettering hls; do
            rustc --edition 2021 -O --test "apps/tools/core/kt-core/src/$f.rs" -o "$d/$f"; "$d/$f"
          done
      - name: M4 — Java's HLS reader (the reference, unchanged; no library here)
        working-directory: apps/tools
        run: sh tests/native/hls.sh
      - name: M4 — tracking, motion, inpaint, lettering and HLS through the Rust core (host library; shadow, strict, parity, benchmark)
        working-directory: apps/tools/core/kt-android
        run: sh jvmtest/screen-rust.sh target/release/libkt_android.so
      # ---- (end of stage M4) ----
      # ---- Stage M5: the Files jobs (copy / move / delete) planned by Rust, executed by Java; their journal; the
      # network storages' rules. Required: each step fails the job.
      - name: M5 — std-only tests (fileplan, filejournal, remoterules; rustc alone)
        run: |
          d="$RUNNER_TEMP/rs-tests-m5"; mkdir -p "$d"
          for f in apps/tools/core/kt-core/src/fileplan.rs apps/tools/core/kt-core/src/filejournal.rs apps/tools/core/kt-core/src/remoterules.rs; do
            n=$(basename "$f" .rs); rustc --edition 2021 --test "$f" -o "$d/$n"; "$d/$n"
          done
      - name: M5 — Java's file jobs alone (the classic engine, and Java's plan through the executor; no library)
        working-directory: apps/tools
        run: sh tests/native/files.sh && sh tests/native/fileplan.sh
      - name: M5 — the file jobs through the Rust engine (host library, strict; planners compared, the journal killed at every record)
        working-directory: apps/tools/core/kt-android
        run: sh jvmtest/filejobs-rust.sh target/release/libkt_android.so
      # ---- (end of stage M5)

      - name: The library for Android (arm64-v8a, armeabi-v7a, x86_64)
        run: bash apps/tools/core/kt-android/build-android.sh "$RUNNER_TEMP/jniLibs"

      # ===== Stage M3 — torrents (apps/tools/core/kt-android-torrent; ANDROID-PORT.md «M3»). The director and the rules
      # are std only and required; librqbit (its own library, libkt_torrent.so, crates.io dependencies) is a try:
      # continue-on-error, and its .so files join $RUNNER_TEMP/jniLibs — so «Pack the library into the app» below
      # carries them — only when all three ABIs built. The size table is the last step of this job. =====
      - name: "M3: the director (simulated swarm) and the phone's torrent rules — rustc alone"
        run: |
          d="$RUNNER_TEMP/m3-tests"; mkdir -p "$d"
          for f in tordirector tormobile; do rustc --edition 2021 -O --test "apps/tools/core/kt-core/src/$f.rs" -o "$d/$f"; done
          "$d/tormobile"
          "$d/tordirector" --nocapture | tee "$d/sim.txt"
          { echo "### Stage M3 — the director against plain sequential and Java's rules (simulated swarm, 5 seeds each; 400 s = never in the run)"; echo; grep '^|' "$d/sim.txt"; echo; } >> "$GITHUB_STEP_SUMMARY"
      - name: "M3: the torrent library's std part (stand-in backend) and its Java door from a JVM"
        working-directory: apps/tools/core/kt-android-torrent
        run: |
          sh test-host.sh "$RUNNER_TEMP/kttor-fake"
          sh jvmtest/torrent.sh "$RUNNER_TEMP/kttor-fake/libkt_torrent.so" ../kt-android/target/release/libkt_android.so fake
      - name: "M3: librqbit for the computer — loopback swarm, JVM call shape (a try)"
        id: m3host
        continue-on-error: true
        working-directory: apps/tools/core/kt-android-torrent
        run: |
          set -o pipefail
          sudo apt-get install -y aria2 > /dev/null
          f=""; cargo build --release || { echo "::warning::librqbit (every call) did not build for the computer — the proven calls only"; f="--no-default-features"; cargo build --release $f; }
          ls -la target/release/libkt_torrent.so
          cargo test --release $f --test loopback -- --nocapture 2>&1 | tee "$RUNNER_TEMP/m3-loopback.txt"
          sh jvmtest/torrent.sh target/release/libkt_torrent.so ../kt-android/target/release/libkt_android.so real
      - name: "M3: libkt_torrent.so for Android — three ABIs or none (a try)"
        id: m3android
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/jniTor"
          bash apps/tools/core/kt-android-torrent/build-android.sh "$RUNNER_TEMP/jniTor"
          for abi in arm64-v8a armeabi-v7a x86_64; do [ -s "$RUNNER_TEMP/jniTor/$abi/libkt_torrent.so" ] || { echo "::warning::libkt_torrent did not build for $abi — no APK carries it"; exit 1; }; done
          for abi in arm64-v8a armeabi-v7a x86_64; do cp "$RUNNER_TEMP/jniTor/$abi/libkt_torrent.so" "$RUNNER_TEMP/jniLibs/$abi/"; done
          cat "$RUNNER_TEMP/jniTor/build.txt" >> "$GITHUB_STEP_SUMMARY"
      # ===== end of stage M3's first block =====

      - name: Web build
        working-directory: apps/tools
        run: |
          for i in 1 2 3; do npm install && break; [ $i = 3 ] && exit 1; echo "npm install failed; again in 20 s"; sleep 20; done
          npm run build
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create Android project
        working-directory: apps/tools
        run: |
          set -o pipefail
          { npx cap add android && node native/android/overlay.mjs && npx cap sync android; } 2>&1 | tee $RUNNER_TEMP/prepare.log
      # (The app module's default jniLibs folder: no Gradle change. A build without this step — every release today —
      # simply has no library, and KtCore reports it absent.)
      - name: Pack the library into the app
        working-directory: apps/tools
        run: |
          mkdir -p android/app/src/main/jniLibs
          cp -R "$RUNNER_TEMP/jniLibs"/. android/app/src/main/jniLibs/
          find android/app/src/main/jniLibs -name '*.so' -exec ls -la {} \;
      - name: Throw-away signing key (no repository secret)
        run: |
          keytool -genkeypair -keystore $RUNNER_TEMP/kt.keystore -alias kurokawa -keyalg RSA -keysize 2048 -validity 30 -storepass kurokawa -keypass kurokawa -dname "CN=check, O=Kurokawa, C=SA" > /dev/null 2>&1
          echo "KR_KEYSTORE=$RUNNER_TEMP/kt.keystore" >> $GITHUB_ENV; echo "KR_KEYSTORE_PASSWORD=kurokawa" >> $GITHUB_ENV; echo "KR_KEY_ALIAS=kurokawa" >> $GITHUB_ENV; echo "KR_KEY_PASSWORD=kurokawa" >> $GITHUB_ENV
      - name: Build the APKs (release, R8 on, as the real build)
        working-directory: apps/tools
        run: |
          set -o pipefail
          cd android && sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties && chmod +x gradlew && (./gradlew --version >/dev/null 2>&1 || ./gradlew --version >/dev/null 2>&1 || true) && ./gradlew assembleRelease --no-daemon 2>&1 | tee $RUNNER_TEMP/build.log | grep -vE "^\s*$" | tail -n 150
          ls -la app/build/outputs/apk/release/
      - name: Each APK carries its library; sizes
        working-directory: apps/tools
        run: |
          set -o pipefail
          python3 core/kt-android/sizes.py --jni "$RUNNER_TEMP/jniLibs" --apks android/app/build/outputs/apk/release --strip "${KT_NDK_BIN:-}/llvm-strip" | tee -a "$GITHUB_STEP_SUMMARY"
      # (An emulator run — the library loaded on Android itself, the shadow mode in a debuggable build — is not done
      # here: it would add 10+ minutes for what the JVM test already proves of the call shape. The owner's phone run
      # with a debug APK is the check on a device.)
      # ===== Stage M3 (its second block: after the APKs exist) — the size table per ABI with and without the torrent
      # library, and what the two tries above came to. =====
      - name: "M3: the torrent library's size, and the tries' verdict"
        if: always()
        working-directory: apps/tools
        run: |
          { echo "### Stage M3 — librqbit: computer build + loopback swarm: ${{ steps.m3host.outcome }}; Android three ABIs: ${{ steps.m3android.outcome }}"; echo; } >> "$GITHUB_STEP_SUMMARY"
          [ -f "$RUNNER_TEMP/m3-loopback.txt" ] && { echo '```'; grep -E "far range|whole file|forced failure|library:" "$RUNNER_TEMP/m3-loopback.txt" | head -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          if [ -d "$RUNNER_TEMP/jniTor" ]; then python3 core/kt-android-torrent/sizes.py --jni "$RUNNER_TEMP/jniTor" --apks android/app/build/outputs/apk/release | tee -a "$GITHUB_STEP_SUMMARY" || true; else echo "No libkt_torrent.so was built: the APKs are without it." | tee -a "$GITHUB_STEP_SUMMARY"; fi
