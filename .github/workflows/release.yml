name: Release reader

# Every push to main that touches the reader builds all its platforms and publishes (or refreshes) the
# GitHub Release named after apps/reader/package.json's version, e.g. v0.2.0. (The repository holds several
# apps — apps/<name> — each with a workflow of its own; the add-on repository they share is under repo/.)
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['apps/reader/**', 'shared/**', 'repo/**', 'scripts/bridge-assets.*', '.github/workflows/release.yml']
  workflow_dispatch:

env:
  APP: apps/reader

# (Read-only for every job but the ones that leave a comment on a failed commit and the one that publishes: those say
# «contents: write» themselves.)
permissions:
  contents: read

# A newer run of the same branch (a manual run on a work branch) cancels the older one; a run on main — or for a tag —
# is never cancelled by a later push: it queues behind the running one.
concurrency:
  group: release-reader-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # (The topics step below writes the repository's topics: REPO_ADMIN_TOKEN when there is one, else the run's own token, which may not.)
    permissions: { contents: write }
    outputs:
      v: ${{ steps.v.outputs.v }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # (The one place the version and the tag come from. It stops the whole run, before anything is built, when the two
      # package.json files differ or docs/notes/v<version>.md is missing, empty or unfinished: scripts/release-check.mjs.)
      - id: v
        run: node scripts/release-check.mjs reader --github-output "$GITHUB_OUTPUT"
      - name: Repository topics
        continue-on-error: true
        env: { GH_TOKEN: '${{ secrets.REPO_ADMIN_TOKEN || github.token }}' }
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/topics" -H "Accept: application/vnd.github+json" \
            --input - <<'JSON'
          {"names":["ebook-reader","epub-reader","pdf-reader","pdf-tools","document-scanner","reader","epub","pdf","docx","arabic","rtl","english","japanese","chinese","korean","android","ios","windows","macos","linux"]}
          JSON

  web:
    name: Web build & tests
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90   # (47 minutes in the 0.64.0 run)
    permissions: { contents: read, actions: read }   # (actions: the lookup of the green Preflight)
    defaults: { run: { working-directory: apps/reader } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }   # (the merge commit and both its parents: the Preflight ran on the second)
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      # (Before the long chain: is there a green FULL Preflight of exactly these files — the same trees of apps/reader, shared, repo,
      # .github/actions and of this workflow? Then the chain below was run on them an hour ago, and only the short chain runs
      # here. No such run — or any trouble finding it — and the full chain runs, as it always did. scripts/find-green-preflight.mjs.)
      - name: Is there a green Preflight of these files
        id: green
        continue-on-error: true   # (any trouble here means «not found»: the full chain runs)
        working-directory: ${{ github.workspace }}
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: node scripts/find-green-preflight.mjs reader --github-output "$GITHUB_OUTPUT"
      - name: Test tools (Playwright, kuromoji)
        run: npm install --no-save playwright@1.64.1 kuromoji@0.1.2 && (npx playwright@1.64.1 install --with-deps chromium || (sleep 30; npx playwright@1.64.1 install --with-deps chromium) || npx playwright@1.64.1 install chromium)
      - name: Tests (the full chain)
        if: steps.green.outputs.found != 'true'
        run: |
          { echo '### Release tests: the full chain'; echo "No green full Preflight of these files: $REASON"; } >> "$GITHUB_STEP_SUMMARY"
          node tests/updater.cjs && node tests/backpdf.cjs && node tests/comicreader.cjs en && node tests/comicreader.cjs ar && node tests/comicarchives.cjs en && node tests/comicarchives.cjs ar && node tests/ranobesession.cjs && node tests/pdffling.cjs && node tests/pdfzoom.cjs && node tests/pdfzoomperf.cjs && node tests/pdfcrop.cjs && node tests/pdftextpic.cjs && node tests/pdf2docxrules.cjs && node tests/pendingmark.cjs && node tests/sourcesupdates.cjs en && node tests/sourcesupdates.cjs ar && node tests/extsearch.cjs en && node tests/extsearch.cjs ar && node tests/translator/run.cjs && node tests/aitabs.cjs en && node tests/aitabs.cjs ar && node tests/aitranslateflow.cjs en && node tests/aitranslateflow.cjs ar && node tests/translatedepub.cjs en && node tests/translatedepub.cjs ar && node tests/customapi.cjs && node tests/pdfsearch.cjs && node tests/copybuttons.cjs && node tests/backupsafe.cjs && node tests/dbatomic.cjs && node tests/libselect.cjs && node tests/libraryhelpers.cjs en && node tests/libraryhelpers.cjs ar && node tests/syncmerge.cjs && node tests/highlightplace.cjs && node tests/readpos.cjs && node tests/staysinbook.cjs && node tests/epubcrash.cjs && node tests/epubglue.cjs && node tests/chaptertitles.cjs && node tests/readgestures.cjs && node tests/perfbudget.cjs && node tests/diag.cjs && node tests/backkeys.cjs && node tests/readbar.cjs && node tests/readbuttons.cjs && node tests/lazychapters.cjs && node tests/pdfroom.cjs && node tests/statsshape.cjs && node tests/platformsettings.cjs && node tests/coverbadges.cjs && node tests/booksearch.cjs && node tests/speakstop.cjs && node tests/exportpins.cjs && node tests/textmeta.cjs && node tests/docxlists.cjs && node tests/epubanchors.cjs && node tests/pdfpassword.cjs && node tests/booksettings.cjs && node tests/chaptermap.cjs && node tests/chapterhealth.cjs && node tests/textrules.cjs && node tests/pdf2docxrunstate.cjs && node tests/pdf2docxchars.cjs && node tests/pdf2docxspaces.cjs && node tests/pdf2docxlines.cjs && node tests/pdf2docxpagenum.cjs && node tests/pdf2docxfonts.cjs && node tests/pdf2docxfontsout.cjs && node tests/pdf2docxmem.cjs && node tests/pdf2docxcorpus.cjs && node tests/pdf2docxcorpus3.cjs && node tests/pdf2docxedit.cjs && node tests/anilistlink.cjs && node tests/alreview.cjs en && node tests/alreview.cjs ar && node tests/glossary.cjs && node tests/aisheetfit.cjs en && node tests/aisheetfit.cjs ar && node tests/glossarytidy.cjs && node tests/glossarytap.cjs en && node tests/glossarytap.cjs ar && node tests/glossarylang.cjs && node tests/pcui.cjs && node tests/pcmenu.cjs && node tests/pcread.cjs && node tests/titlebar.cjs reader && node tests/appicon.cjs && node tests/resettle.cjs && node tests/resettle.cjs late && node tests/scrollsites.cjs && node tests/convbudget.cjs && node tests/firstrun.cjs && node tests/handover.cjs && node tests/handover-fixture.cjs && node tests/installerpatch.cjs && node tests/updatenames.cjs && node tests/setupui.cjs && node tests/tauribridge.cjs && node tests/pins.cjs && node tests/deletebooks.cjs && node tests/undo.cjs && node tests/undopill.cjs && node tests/uihunt.cjs && node tests/startup.cjs && node tests/glass.cjs && node tests/styleeditor.cjs && node tests/stylepair.cjs && node tests/apptheme.cjs && node tests/readingdict.cjs && node tests/readingdictreal.cjs && node tests/readingdictkuro.cjs && node tests/shared-copies.cjs
        env: { REASON: '${{ steps.green.outputs.reason }}' }
      # (The short chain: the updater, the start-up budget and the smoke set. Their sources are in the chain above too.)
      - name: Tests (the short chain, a green Preflight stands in for the rest)
        if: steps.green.outputs.found == 'true'
        run: |
          { echo '### Release tests: the short chain'; echo "The full chain ran in Preflight [run $RUN_ID]($RUN_URL) on $SHA: $REASON"; } >> "$GITHUB_STEP_SUMMARY"
          node tests/updater.cjs && node tests/updatenames.cjs && node tests/installerpatch.cjs && node tests/handover.cjs && node tests/handover-fixture.cjs && node tests/perfbudget.cjs && node tests/startup.cjs && node tests/pcui.cjs && node tests/readpos.cjs && node tests/pdfroom.cjs
        env: { RUN_ID: '${{ steps.green.outputs.run_id }}', RUN_URL: '${{ steps.green.outputs.run_url }}', SHA: '${{ steps.green.outputs.sha }}', REASON: '${{ steps.green.outputs.reason }}' }
      - name: Package web build
        run: cd dist && zip -r ../KurokawaReader-web.zip . && cd ..
      - uses: actions/upload-artifact@v4
        with: { name: web, path: apps/reader/KurokawaReader-web.zip }

  android:
    needs: version
    name: Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write }   # (the failure comment)
    defaults: { run: { working-directory: apps/reader } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
        env: { KR_SLIM: '1' }
      - name: Accept Android SDK licences (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create Android project
        shell: bash
        run: |
          set -o pipefail
          { npx cap add android && node native/android/overlay.mjs && npx cap sync android && rm -f android/app/src/main/assets/public/samples/alice-in-wonderland.epub; } 2>&1 | tee $RUNNER_TEMP/android-prepare.log
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > $RUNNER_TEMP/kr.keystore
            # Alias and key password default sensibly when only the keystore + its password are set.
            SP='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
            AL='${{ secrets.ANDROID_KEY_ALIAS }}'; [ -n "$AL" ] || AL=kurokawa
            KP='${{ secrets.ANDROID_KEY_PASSWORD }}'; [ -n "$KP" ] || KP="$SP"
            echo "KR_KEYSTORE_PASSWORD=$SP" >> $GITHUB_ENV
            echo "KR_KEY_ALIAS=$AL" >> $GITHUB_ENV
            echo "KR_KEY_PASSWORD=$KP" >> $GITHUB_ENV
            keytool -list -keystore $RUNNER_TEMP/kr.keystore -storepass "$SP" -alias "$AL" > /dev/null 2>&1 && echo "Signing with alias $AL from the repository secrets." || { echo "::error::Keystore secret present but alias '$AL' / password do not open it."; exit 1; }

          else
            # No keystore secret: sign with a throw-away key. Set the ANDROID_KEYSTORE_* secrets
            # (docs/INSTALL.md) so releases share one private signature and update over each other.
            # (A release from main is never signed with a one-off key: phones could not update over the last one.)
            if [ "$GITHUB_REF" = refs/heads/main ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret missing — a release is not signed with a one-off key."; exit 1; fi
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret missing — APKs signed with a one-off key; they will not install over an earlier release."
            keytool -genkeypair -v -keystore $RUNNER_TEMP/kr.keystore -alias kurokawa -keyalg RSA -keysize 2048 -validity 10000 -storepass kurokawa -keypass kurokawa -dname "CN=KurokawaReader, O=Kurokawa, C=SA"
            echo "KR_KEYSTORE_PASSWORD=kurokawa" >> $GITHUB_ENV
            echo "KR_KEY_ALIAS=kurokawa" >> $GITHUB_ENV
            echo "KR_KEY_PASSWORD=kurokawa" >> $GITHUB_ENV
          fi
          echo "KR_KEYSTORE=$RUNNER_TEMP/kr.keystore" >> $GITHUB_ENV
      - name: Build release APKs
        shell: bash
        run: |
          set -o pipefail
          cd android && sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties && chmod +x gradlew && (./gradlew --version >/dev/null 2>&1 || ./gradlew --version >/dev/null 2>&1 || true) && ./gradlew assembleRelease --no-daemon 2>&1 | tee $RUNNER_TEMP/android-build.log | grep -vE "^\s*$" | tail -n 400
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### Android job failed"; echo '```'; tail -n 120 $RUNNER_TEMP/android-prepare.log $RUNNER_TEMP/android-build.log 2>/dev/null | tail -c 60000; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null || true
      - name: Collect APKs
        run: |
          mkdir -p out
          V=${{ needs.version.outputs.v }}
          for f in android/app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            abi=$(echo "$base" | sed -E 's/app-(.*)-release.*\.apk/\1/')
            cp "$f" "out/KurokawaReader-$V-$abi.apk"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: apps/reader/out/*.apk }

  ios:
    needs: version
    name: iOS IPA (unsigned, for AltStore / SideStore)
    runs-on: macos-15
    # (A macOS runner that never comes is not a reason to hold the release: the IPA is attached when it does.)
    timeout-minutes: 40
    continue-on-error: true
    defaults: { run: { working-directory: apps/reader } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
        env: { KR_SLIM: '1' }
      - name: Create iOS project
        shell: bash
        run: |
          set -o pipefail
          { npx cap add ios && node native/ios/overlay.mjs && npx cap sync ios && rm -f ios/App/App/public/samples/alice-in-wonderland.epub; } 2>&1 | tee $RUNNER_TEMP/ios-prepare.log
      - name: Archive without signing
        shell: bash
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath $RUNNER_TEMP/App.xcarchive archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=app.kurokawa.reader 2>&1 | tee $RUNNER_TEMP/ios-build.log | grep -E "error|warning: .*fail|BUILD|ARCHIVE" || true
          test -d $RUNNER_TEMP/App.xcarchive/Products/Applications/App.app
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### iOS job failed"; echo '```'; tail -n 120 $RUNNER_TEMP/ios-prepare.log 2>/dev/null; grep -E "error:" $RUNNER_TEMP/ios-build.log 2>/dev/null | head -n 60; tail -n 40 $RUNNER_TEMP/ios-build.log 2>/dev/null; echo '```'; } | tail -c 60000 > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null || true
      - name: Package IPA
        run: |
          V=${{ needs.version.outputs.v }}
          mkdir -p Payload out
          cp -R $RUNNER_TEMP/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry "out/KurokawaReader-$V-ios-unsigned.ipa" Payload
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: apps/reader/out/*.ipa }

  # ---------- The Rust (Tauri) build: the computer app (the Electron build is no longer built) ----------
  # Its files never take the old Electron build's names, so no old copy's own updater takes one by mistake:
  # KurokawaReader-<v>-windows-x64-setup.exe, …-windows-x64-portable.zip, …-macos-universal.DMG, …-linux-x64.appimage,
  # …-linux-x64.deb (desktop-tauri/src-tauri/src/updatelogic.rs, src/updateCore.ts). (An old Electron copy's page takes
  # the first /\.dmg$/ and the first /\.AppImage$/ — case-sensitive —: the Rust disk image and AppImage end «.DMG» and
  # «.appimage», which those patterns cannot match, whatever the order of the files. What those copies DO find is the
  # frozen bridge build, carried forward by the «Carry forward» step of the release job.)
  rust-desktop:
    needs: version
    name: Rust ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90   # (7 to 11 minutes in the 0.64.0 run with a warm cache)
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, bundles: 'nsis', target: '', optional: false }
          - { name: Linux, os: ubuntu-22.04, bundles: 'appimage,deb', target: '', optional: false }
          - { name: macOS, os: macos-15, bundles: 'dmg', target: 'universal-apple-darwin', optional: true }
    defaults: { run: { shell: bash, working-directory: apps/reader } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build && rm -f dist/samples/alice-in-wonderland.epub
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev file
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/reader/desktop-tauri/src-tauri -> target'
          key: release-${{ matrix.target }}
      - name: 7-Zip for the bundle
        working-directory: apps/reader/desktop
        run: |
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then archs="x64 arm64"; else archs=$(node -p process.arch); fi
          plat=$(node -p "({ win32: 'win', darwin: 'mac' })[process.platform] || 'linux'")
          for arch in $archs; do src="node_modules/7zip-bin/$plat/$arch"; if [ -d "$src" ]; then mkdir -p "../desktop-tauri/7zip/$plat/$arch"; cp "$src"/7za* "../desktop-tauri/7zip/$plat/$arch/"; chmod +x "../desktop-tauri/7zip/$plat/$arch/"7za* || true; fi; done
          find node_modules/7zip-bin -maxdepth 1 -type f \( -iname '*licen*' -o -iname 'copying*' \) -exec cp {} ../desktop-tauri/7zip/ \;
      - name: Build
        working-directory: apps/reader/desktop-tauri
        run: |
          npx --yes @tauri-apps/cli@^2 icon ../desktop/icon.png
          if [ -n "${{ matrix.target }}" ]; then npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}; else npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }}; fi
      # (Windows: the installer's one screen — Tauri's own installer is kept, with a warning, if it cannot be put in.)
      - name: One-page installer
        if: runner.os == 'Windows'
        working-directory: apps/reader/desktop-tauri
        run: node src-tauri/installer/onepage.cjs src-tauri
      # (Stage R6c, Windows: the designed setup program — desktop-tauri/setup, setup/INTEGRATION.md — with the NSIS
      # installer above embedded and run silently underneath. Published as the Windows download people take,
      # KurokawaReader-<v>-windows-x64.exe; the plain NSIS installer stays …-windows-x64-setup.exe, the file the app's
      # updater picks (updatelogic.rs, desktop/rustswitch.cjs, src/updateCore.ts). Should it fail to build, the release
      # still has the plain installer, and the job says so.)
      - name: Setup program
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        working-directory: apps/reader/desktop-tauri/src-tauri
        run: |
          $inner = Get-ChildItem 'target/release/bundle/nsis/*-setup.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $inner) { throw 'no NSIS installer to embed' }
          $v = (node -p "require('../../package.json').version").Trim()
          $env:KR_SETUP_INNER = $inner.FullName
          $env:KR_SETUP_APP_BYTES = "$((Get-Item 'target/release/KurokawaReader.exe').Length)"
          $env:CARGO_TARGET_DIR = (Resolve-Path 'target').Path
          cargo build --release --manifest-path ../setup/src-tauri/Cargo.toml 2>&1 | Write-Host
          if ($LASTEXITCODE) { "::warning::the setup program did not build: the release has the plain installer only"; throw "setup program: cargo build failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force -Path 'target/release/bundle/setup' | Out-Null
          Copy-Item 'target/release/KurokawaReaderSetup.exe' "target/release/bundle/setup/KurokawaReader-$v-windows-x64.exe" -Force
      - name: Collect, under the release's names
        working-directory: apps/reader/desktop-tauri/src-tauri
        run: |
          V=${{ needs.version.outputs.v }}; mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/bundle/nsis/*-setup.exe "out/KurokawaReader-$V-windows-x64-setup.exe"
            for f in target/release/bundle/setup/*-windows-x64.exe; do [ -f "$f" ] && cp "$f" "out/KurokawaReader-$V-windows-x64.exe"; done
            p="$RUNNER_TEMP/kr-portable"; mkdir -p "$p"; cp target/release/KurokawaReader.exe "$p/"; [ -d target/release/7zip ] && cp -r target/release/7zip "$p/"
            echo 'This copy is portable: it never updates itself. Download the new portable zip from the release page.' > "$p/KurokawaReader.portable"
            (cd "$p" && 7z a -tzip -mx=7 "$GITHUB_WORKSPACE/apps/reader/desktop-tauri/src-tauri/out/KurokawaReader-$V-windows-x64-portable.zip" . > /dev/null)
          elif [ "$RUNNER_OS" = macOS ]; then
            cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/KurokawaReader-$V-macos-universal.DMG"
          else
            cp target/release/bundle/appimage/*.AppImage "out/KurokawaReader-$V-linux-x64.appimage"
            cp target/release/bundle/deb/*.deb "out/KurokawaReader-$V-linux-x64.deb"
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: 'rust-${{ runner.os }}', path: apps/reader/desktop-tauri/src-tauri/out/* }

  release:
    name: Publish release
    needs: [version, web, android, ios, rust-desktop]
    # Published when every build but the macOS one succeeded (the Rust macOS build is optional: no macOS runner may come;
    # the matrix's continue-on-error makes its failure no failure of the job). The Windows and Linux Rust files are asked
    # for by name below.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.web.result == 'success' && needs.android.result == 'success' && needs.rust-desktop.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }   # (creates the release, uploads its files)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Note a missing IPA
        if: ${{ needs.ios.result != 'success' }}
        run: echo "IOS_NOTE=- _The iOS build did not run this time (no macOS runner came); the previous release's IPA still works, and the next release will carry a new one._" >> $GITHUB_ENV
      - name: Release notes
        run: |
          [ -s "$APP/docs/notes/v${{ needs.version.outputs.v }}.md" ] || { echo "::error::$APP/docs/notes/v${{ needs.version.outputs.v }}.md is missing or empty"; exit 1; }
          # What's new: commit subjects since the previous release, split into bullets.
          git fetch --tags --quiet || true
          PREV=$(git tag --sort=-v:refname | grep "^v[0-9]" | grep -v "^v${{ needs.version.outputs.v }}$" | head -n 1)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD~5..HEAD"; fi
          git log --format='%s' $RANGE | grep -v -i -E '^(ci|release|docs|chore|build|test)(\(|:)|readme|^merge |^update [a-z0-9_./-]+\.(md|yml|yaml|json|txt)$|^create [a-z0-9_./-]+\.(md|yml|yaml)$|^delete ' | sed -E 's/^v?[0-9]+\.[0-9]+\.[0-9]+: //' | tr ';' '\n' | sed -E 's/^ +//; s/^(.)/- \u\1/' | grep -v '^- $' > whatsnew.txt || true
          {
            echo "## KurokawaReader v${{ needs.version.outputs.v }}"
            echo
            echo "## What's new"
            # (The notes written for this version, docs/notes/v<version>.md: the version job has already refused a missing or empty file, and there is no fallback text — the commit subjects above are only kept for the log.)
            cat "$APP/docs/notes/v${{ needs.version.outputs.v }}.md"
            if [ -n "$IOS_NOTE" ]; then echo "$IOS_NOTE"; fi
            # (The computer build is optional on macOS only: without it the previous release's disk image stays the Mac download, and
            # a Mac copy keeps updating from there — it takes the newest release that has one.)
            if [ ! -d artifacts/rust-macOS ]; then echo "- _macOS: the new build did not come this time (no macOS runner came); the previous release's disk image stays the Mac download._"; fi
            echo
            echo "## Files"
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Android (most phones) | \`*-arm64-v8a.apk\` |"
            echo "| Android (older 32-bit phones) | \`*-armeabi-v7a.apk\` |"
            echo "| Android (emulators / x86 tablets) | \`*-x86_64.apk\` |"
            echo "| Android (any, larger) | \`*-universal.apk\` |"
            echo "| Windows | \`*-windows-x64.exe\` — the installer (a few seconds, no administrator rights). The classic installer is \`*-windows-x64-setup.exe\`; the portable build is \`*-windows-x64-portable.zip\` |"
            echo "| macOS | \`*-macos-universal.DMG\` (unsigned: right-click → Open the first time) |"
            echo "| Linux | \`*-linux-x64.appimage\` (chmod +x, then run), or \`*-linux-x64.deb\` |"
            echo "| iOS | \`*-ios-unsigned.ipa\` — AltStore / SideStore source: \`https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/altstore.json\` · TrollStore · or install the web app from https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ |"
            echo "| Web (self-host) | \`KurokawaReader-web.zip\` — or use the hosted app above |"
            echo
            echo "_\`*-SHA256SUMS.txt\` holds every file's SHA-256, which the app's updater checks before it installs anything. The files named \`*-win-x64*.exe\`, \`*-mac-universal.dmg\`, \`*-linux-x86_64.AppImage\`, \`latest*.yml\` and \`*.blockmap\` are the last copy of the program this app replaced, repeated in every release only so that an older copy can update itself to the new app: they are not downloads to choose._"
            echo
            cat $APP/docs/INSTALL.md
          } > notes.md
      - name: Commit to tag
        # The tag goes on main's newest commit when the reader is the same there: GitHub refuses this job's token a
        # tag on an older commit whose workflow files differ from main's (403 «Resource not accessible by integration»).
        run: |
          git fetch --quiet origin main
          if git diff --quiet ${{ github.sha }} origin/main -- $APP shared repo; then echo "TARGET=$(git rev-parse origin/main)" >> $GITHUB_ENV; else echo "TARGET=${{ github.sha }}" >> $GITHUB_ENV; fi
      # (The frozen Electron «bridge» build's files — scripts/bridge-assets.json —, repeated in every release. An OLD installed
      # Electron copy finds its update by name: the page takes /win-x64.*\.exe$/ (portable: …portable), the first /\.dmg$/ and the
      # first /\.AppImage$/ of the newest release, and electron-updater reads latest.yml (Windows installer) and
      # latest-linux.yml (AppImage) of it. They are fetched from the bridge release's tag with this job's token, each
      # checked against the SHA-256 committed in the list — a list not yet filled, a file missing or different stops the
      # release here, before anything is published —, and the two yml files are written afresh: the NEW version, over the
      # bridge's own files, so the old copy sees a newer version, downloads the bridge build (the hash it checks is of the
      # very file it gets) and the bridge makes the hand-over and installs the Rust build.)
      - name: Carry forward the bridge build's files (old Electron copies still reach the new app)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V=${{ needs.version.outputs.v }}
          TAG=$(node scripts/bridge-assets.mjs reader --tag)
          mkdir -p artifacts/bridge
          for n in $(node scripts/bridge-assets.mjs reader --names); do gh release download "$TAG" --pattern "$n" --dir artifacts/bridge --clobber -R "$GITHUB_REPOSITORY"; done
          node scripts/bridge-assets.mjs reader --verify artifacts/bridge
          node scripts/bridge-assets.mjs reader --yml artifacts/bridge --version "$V"
          cat artifacts/bridge/latest.yml artifacts/bridge/latest-linux.yml
          ls -la artifacts/bridge
      # (Every file's SHA-256, under its published name: the Rust build's updater refuses a file that does not match.)
      - name: Checksums
        run: |
          V=${{ needs.version.outputs.v }}
          (cd artifacts && find . -type f ! -name '*.blockmap' -print0 | sort -z | xargs -0 sha256sum | sed -E 's#  \./[^/]+/#  #') > "KurokawaReader-$V-SHA256SUMS.txt"
          cat "KurokawaReader-$V-SHA256SUMS.txt"
      # (What a release must carry, by name — the files the job conditions above promise; the iOS and macOS files are optional by
      # design and are not asked for. The computer app is the Rust build: its Windows and Linux files must be there, and the
      # bridge build's, which the step above fetched and checked.)
      - name: The release's files are all there
        run: |
          V=${{ needs.version.outputs.v }}; missing=0
          need() { if ! ls artifacts/*/"$1" > /dev/null 2>&1; then echo "::error::missing from the release: $1"; missing=1; fi; }
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do need "KurokawaReader-$V-$abi.apk"; done
          need "KurokawaReader-$V-windows-x64-setup.exe"; need "KurokawaReader-$V-windows-x64-portable.zip"; need "KurokawaReader-$V-linux-x64.appimage"; need "KurokawaReader-web.zip"
          for n in $(node scripts/bridge-assets.mjs reader --names) latest.yml latest-linux.yml; do need "$n"; done
          [ -s "KurokawaReader-$V-SHA256SUMS.txt" ] || { echo "::error::no checksums file"; missing=1; }
          exit $missing
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: KurokawaReader v${{ needs.version.outputs.v }}
          target_commitish: ${{ env.TARGET }}
          body_path: notes.md
          make_latest: true
          files: |
            artifacts/web/*
            artifacts/android/*
            artifacts/ios/*
            artifacts/bridge/*
            KurokawaReader-*-SHA256SUMS.txt
      # (The Rust build's files, uploaded after the others. Their names already keep every old Electron copy's updater off
      # them — «.DMG», «.appimage», «windows-…» —, so the order no longer matters: an Electron copy takes the bridge
      # build, which makes the hand-over and then offers the move itself.)
      - name: The Rust build's files
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for d in artifacts/rust-*; do [ -d "$d" ] && gh release upload "${{ needs.version.outputs.tag }}" "$d"/* --clobber -R "$GITHUB_REPOSITORY"; done

  # (The Pages site — both apps' web builds and the AltStore source — is deployed by pages.yml once this run ends.)
