name: OTL pack

# A companion pack for the OTL web folder: every series' cover made small (and, matched on AniList, its genres
# and tags), published to the "packs" release, so the app shows the shelf of covers at once — one small picture
# from GitHub per series — instead of reading a piece of each series' first EPUB from the site.
on:
  workflow_dispatch:
  push:
    branches: ['work-*', main]
    paths: ['.github/workflows/otl-pack.yml', 'scripts/pack/**']
  schedule:
    - cron: '41 2 * * 1'   # weekly

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe the site
        run: |
          set +e
          curl -sS -o /tmp/probe.html -w '%{http_code} %{content_type}\n' -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36' 'https://server.elscione.com/Officially%20Translated%20Light%20Novels/'
          head -c 600 /tmp/probe.html; echo
          curl -sS -o /tmp/api.json -w '%{http_code} %{content_type}\n' -X POST -H 'content-type: application/json;charset=utf-8' -H 'x-requested-with: XMLHttpRequest' -A 'Mozilla/5.0' \
            --data '{"action":"get","items":{"href":"/Officially Translated Light Novels/","what":1}}' 'https://server.elscione.com/Officially%20Translated%20Light%20Novels/?'
          head -c 600 /tmp/api.json; echo
