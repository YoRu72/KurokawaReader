name: Release tools

# Every push to main that touches Kurokawa Tools builds it for Android, Windows, macOS and Linux and publishes
# (or refreshes) the pre-release tools-v<version> (apps/tools/package.json). Pre-releases, so the reader's own
# updater — which asks GitHub for the latest release — never mistakes a Tools release for one of its own.
# From the switch-over (Tools' stage P9) the computer's main download is the Rust (Tauri) build (the rust-desktop job);
# the Electron jobs still publish under their old names — the bridge build, RUST_SWITCH on — for two versions, as the
# «previous build» (apps/tools/desktop-tauri/PORTING.md «Stage P9»).
on:
  push:
    branches: [main]
    paths: ['apps/tools/**', 'shared/**', '.github/workflows/release-tools.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: apps/tools

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "v=$(node -p "require('./apps/tools/package.json').version")" >> $GITHUB_OUTPUT

  web:
    name: Web build & tests
    needs: version
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/tools } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run typecheck
      # (KR_META=1 also writes meta.json beside dist — outside it, so the artefact is the same — which tests/perfstart.cjs reads.)
      - run: npm run build
        env: { KR_META: '1' }
      # (The runner's package server is sometimes unreachable: tried twice with its system packages, then without
      # them — the runner already has what Chromium needs.)
      - run: npx playwright@1.64.1 install --with-deps chromium || (sleep 30; npx playwright@1.64.1 install --with-deps chromium) || npx playwright@1.64.1 install chromium
      - run: npm install --no-save playwright@1.64.1 ts-api@npm:typescript@6.0.3 && node tests/desktop-files.cjs && node tests/ytdlp-js.cjs && node tests/aria2-start.cjs && node tests/shared-copies.cjs && node tests/native-stub.cjs && node tests/packs.cjs && node tests/downloads-options.cjs en && node tests/done.cjs en && node tests/models.cjs en && node tests/models.cjs ar && node tests/engine2.cjs en && node tests/engine2.cjs ar && node tests/grab.cjs en && node tests/mini.cjs en && node tests/mini.cjs ar && node tests/tabs.cjs && node tests/browser.cjs en && node tests/browser.cjs ar && node tests/library.cjs && node tests/pick.cjs && node tests/files.cjs && node tests/social.cjs && node tests/grabjs.cjs && node tests/av.cjs && node tests/tv.cjs && node tests/tvsearch.cjs && node tests/torrentstream.cjs && node tests/soundbeside.cjs && node tests/transcode.cjs && node tests/lettering.cjs && node tests/subfont.cjs && node tests/speedtest.cjs && node tests/inpaint.cjs && node tests/swipe.cjs && node tests/gestures.cjs && node tests/filesnames.cjs && node tests/filesjobs.cjs && node tests/filesclip.cjs && node tests/filesback.cjs && node tests/filesview.cjs && node tests/filesbatch.cjs && node tests/videoargs.cjs && node tests/videojob.cjs && node tests/videochoice.cjs en && node tests/videochoice.cjs ar && node tests/aria2poll.cjs && node tests/dlfix.cjs en && node tests/dlfix.cjs ar && node tests/desktoppaths.cjs && node tests/submatch.cjs && node tests/subpacks.cjs en && node tests/subpacks.cjs ar && node tests/mega.cjs && node tests/gdrive.cjs && node tests/mpvplayer.cjs && node tests/apk.cjs && node tests/swarm.cjs && node tests/settingscards.cjs && node tests/backnav.cjs && node tests/backlayers.cjs && node tests/videoback.cjs && node tests/thumbs.cjs && node tests/playerrotate.cjs && node tests/sharedsave.cjs && node tests/picker.cjs && node tests/settingstabs.cjs && node tests/updater.cjs && node tests/player.cjs && node tests/videos.cjs && node tests/taskfiles.cjs en && node tests/taskfiles.cjs ar && node tests/anilistlink.cjs en && node tests/anilistlink.cjs ar && node tests/animenotes.cjs en && node tests/animenotes.cjs ar && node tests/animewatch.cjs en && node tests/animewatch.cjs ar && node tests/subsearchpack.cjs en && node tests/subsearchpack.cjs ar && node tests/ipa.cjs en && node tests/ipa.cjs ar && node tests/archive.cjs && node tests/tdz.cjs en && node tests/library.cjs ar && sh tests/native/downloader.sh && sh tests/native/screen.sh && sh tests/native/hls.sh && sh tests/native/fileplan.sh && sh tests/native/video.sh && node tests/screen.cjs en && node tests/screen.cjs ar && node tests/screenpc.cjs en && node tests/screenpc.cjs ar && node tests/folderaccess.cjs en && node tests/folderaccess.cjs ar && node tests/relink.cjs en && node tests/relink.cjs ar && node tests/installroute.cjs && node tests/replay.cjs && node tests/playertr.cjs && node tests/intake.cjs && node tests/playerpad.cjs && node tests/navtabs.cjs && node tests/anime.cjs && node tests/pcui.cjs && node tests/pcengine.cjs && node tests/pcmenu.cjs && node tests/pcsettings.cjs && node tests/titlebar.cjs tools && node tests/desktopstarter.cjs && node tests/appicon.cjs && node tests/smoke.cjs en && node tests/smoke.cjs ar && node tests/aria2.cjs && node tests/discover.cjs && node tests/mpvclear.cjs && node tests/mpvsee.cjs && node tests/tlsfallback.cjs && node tests/imgretry.cjs && node tests/nativelint.cjs && node tests/installerpatch.cjs && node tests/updatenames.cjs && node tests/handover.cjs && node tests/firstrun.cjs && node tests/setupui.cjs && node tests/hybridcookies.cjs && node tests/themes.cjs && node tests/themepacks.cjs && node tests/themeeditor.cjs && node tests/undo.cjs && node tests/dlengine.cjs && node tests/torengine.cjs && node tests/screenengine.cjs && node tests/rustcore.cjs && node tests/advancedrows.cjs && node tests/ytspeed.cjs && node tests/ytfail.cjs && node tests/ytjobs.cjs && node tests/rowpatch.cjs && node tests/videohosts.cjs && node tests/perfidle.cjs && node tests/longlist.cjs && node tests/ghcache.cjs && node tests/addprobe.cjs && node tests/debrid.cjs && node tests/desktauri.cjs && node tests/filestauri.cjs && node tests/archive7z.cjs && node tests/screentauri.cjs && node tests/streamtauri.cjs && node tests/search.cjs && node tests/subs.cjs && node tests/video.cjs && node tests/strings.cjs && node tests/perfviews.cjs && node tests/directfile.cjs en && node tests/directfile.cjs ar && node tests/filename.cjs && node tests/themedefault.cjs && node tests/animbg.cjs && node tests/openwith.cjs && node tests/extractsafe.cjs && node tests/extractsheet.cjs && sh tests/native/arc.sh && node tests/filesextras.cjs && node tests/perfstart.cjs && node scripts/themes.mjs --check
      - name: Package web build
        run: cd dist && zip -r ../KurokawaTools-web.zip . && cd ..
      - uses: actions/upload-artifact@v4
        with: { name: web, path: apps/tools/KurokawaTools-web.zip }

  android:
    needs: version
    name: Android APKs
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/tools } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create Android project
        shell: bash
        run: |
          set -o pipefail
          { npx cap add android && node native/android/overlay.mjs && npx cap sync android; } 2>&1 | tee $RUNNER_TEMP/android-prepare.log
      # (The Rust core, docs/RUST-PORT.md §5 — apps/tools/core/kt-android/switch-over/NOTES.md. From 0.17.0 in every
      # release; the phone's download engine still defaults to Java (Settings → Advanced offers Rust). It never stops a
      # release: the library is copied into the APKs only when all three ABIs built — otherwise nothing is copied, the
      # APKs are built exactly as before and the app keeps its Java code (KtCore reports the core absent).)
      - name: Rust core for Android (optional)
        continue-on-error: true
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rm -rf "$RUNNER_TEMP/jniLibs"
          bash core/kt-android/build-android.sh "$RUNNER_TEMP/jniLibs"
          for abi in arm64-v8a armeabi-v7a x86_64; do [ -s "$RUNNER_TEMP/jniLibs/$abi/libkt_android.so" ] || { echo "::warning::the Rust core did not build for $abi — the APKs are built without it (Java only)"; exit 1; }; done
          # (A copy broken off midway takes every library it put back out: all three or none.)
          j=android/app/src/main/jniLibs
          if ! { mkdir -p "$j" && cp -R "$RUNNER_TEMP/jniLibs"/. "$j"/; }; then find "$j" -name 'libkt_android.so' -delete 2>/dev/null; exit 1; fi
          find "$j" -name 'libkt_android.so' -exec ls -la {} \;
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > $RUNNER_TEMP/kr.keystore
            SP='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
            AL='${{ secrets.ANDROID_KEY_ALIAS }}'; [ -n "$AL" ] || AL=kurokawa
            KP='${{ secrets.ANDROID_KEY_PASSWORD }}'; [ -n "$KP" ] || KP="$SP"
            echo "KR_KEYSTORE_PASSWORD=$SP" >> $GITHUB_ENV; echo "KR_KEY_ALIAS=$AL" >> $GITHUB_ENV; echo "KR_KEY_PASSWORD=$KP" >> $GITHUB_ENV
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret missing — APKs signed with a one-off key."
            keytool -genkeypair -v -keystore $RUNNER_TEMP/kr.keystore -alias kurokawa -keyalg RSA -keysize 2048 -validity 10000 -storepass kurokawa -keypass kurokawa -dname "CN=KurokawaTools, O=Kurokawa, C=SA"
            echo "KR_KEYSTORE_PASSWORD=kurokawa" >> $GITHUB_ENV; echo "KR_KEY_ALIAS=kurokawa" >> $GITHUB_ENV; echo "KR_KEY_PASSWORD=kurokawa" >> $GITHUB_ENV
          fi
          echo "KR_KEYSTORE=$RUNNER_TEMP/kr.keystore" >> $GITHUB_ENV
      - name: Build release APKs
        shell: bash
        run: |
          set -o pipefail
          cd android && sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties && chmod +x gradlew && (./gradlew --version >/dev/null 2>&1 || ./gradlew --version >/dev/null 2>&1 || true) && ./gradlew assembleRelease --no-daemon 2>&1 | tee $RUNNER_TEMP/android-build.log | grep -vE "^\s*$" | tail -n 400
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### Tools Android job failed"; echo '```'; tail -n 120 $RUNNER_TEMP/android-prepare.log $RUNNER_TEMP/android-build.log 2>/dev/null | tail -c 60000; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null || true
      - name: Collect APKs
        run: |
          mkdir -p out; V=${{ needs.version.outputs.v }}
          for f in android/app/build/outputs/apk/release/*.apk; do base=$(basename "$f"); abi=$(echo "$base" | sed -E 's/app-(.*)-release.*\.apk/\1/'); cp "$f" "out/KurokawaTools-$V-$abi.apk"; done
          ls -la out
      # (The «-a11y» variant declares the screen translator's accessibility service — the one thing Google Play Protect
      # blocks an app installed from a file for — so the ordinary APKs leave it out and read the screen as a picture.)
      - name: Build the a11y variant (the screen translator's accessibility service declared)
        shell: bash
        run: |
          set -o pipefail
          node native/android/a11y.mjs
          cd android && ./gradlew assembleRelease --no-daemon 2>&1 | tee $RUNNER_TEMP/android-a11y.log | grep -vE "^\s*$" | tail -n 200
      - name: Collect the a11y APKs
        run: |
          V=${{ needs.version.outputs.v }}
          for f in android/app/build/outputs/apk/release/*.apk; do base=$(basename "$f"); abi=$(echo "$base" | sed -E 's/app-(.*)-release.*\.apk/\1/'); cp "$f" "out/KurokawaTools-$V-$abi-a11y.apk"; done
          ls -la out
      - name: Packs (Python and ffmpeg, downloaded by the app when an add-on needs them)
        run: python3 scripts/packs.py out && ls -la out
      - name: The mpv pack (the Player add-on's engine, from mpv-android's release)
        continue-on-error: true   # (without it the player plays with the web view; the release goes out either way)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 scripts/mpvpack.py out && ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "apps/tools/out/*" }

  windows:
    needs: version
    name: Windows EXE
    runs-on: windows-latest
    defaults: { run: { working-directory: apps/tools } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: Build installer and portable EXE
        shell: bash
        run: |
          cd desktop; V=${{ needs.version.outputs.v }}
          npm version "$V" --no-git-tag-version --allow-same-version || true
          # (Prebuilt native modules come from GitHub's release downloads, which fail now and then: three tries.)
          for i in 1 2 3; do npm install && break; [ $i = 3 ] && exit 1; echo "npm install failed; again in 20 s"; sleep 20; done
          node fetch-aria2.mjs
          npx electron-builder --win nsis portable --publish never 2>&1 | tee $RUNNER_TEMP/win-build.log | tail -n 200
          node ffmpeg-pack.cjs
          ls -la out
      - name: Report failure
        if: failure()
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### Tools Windows job failed"; echo '```'; tail -n 120 $RUNNER_TEMP/win-build.log 2>/dev/null; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/tools/desktop/out/*.exe
            apps/tools/desktop/out/KurokawaTools-pack-*.gz
            apps/tools/desktop/out/*.packpart.json

  macos:
    needs: version
    name: macOS DMG
    runs-on: macos-15
    defaults: { run: { working-directory: apps/tools } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: Build DMG (unsigned; universal)
        shell: bash
        run: |
          cd desktop; V=${{ needs.version.outputs.v }}
          npm version "$V" --no-git-tag-version --allow-same-version || true
          # (Prebuilt native modules come from GitHub's release downloads, which fail now and then: three tries.)
          for i in 1 2 3; do npm install && break; [ $i = 3 ] && exit 1; echo "npm install failed; again in 20 s"; sleep 20; done
          node fetch-aria2.mjs
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dmg zip --universal --publish never 2>&1 | tee $RUNNER_TEMP/mac-build.log | tail -n 60
          node ffmpeg-pack.cjs x64
          ls -la out
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### Tools macOS job failed"; echo '```'; tail -n 120 $RUNNER_TEMP/mac-build.log 2>/dev/null; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            apps/tools/desktop/out/*.dmg
            apps/tools/desktop/out/KurokawaTools-pack-*.gz
            apps/tools/desktop/out/*.packpart.json

  linux:
    needs: version
    name: Linux AppImage
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/tools } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: Build AppImage
        shell: bash
        run: |
          cd desktop; V=${{ needs.version.outputs.v }}
          npm version "$V" --no-git-tag-version --allow-same-version || true
          # (Prebuilt native modules come from GitHub's release downloads, which fail now and then: three tries.)
          for i in 1 2 3; do npm install && break; [ $i = 3 ] && exit 1; echo "npm install failed; again in 20 s"; sleep 20; done
          node fetch-aria2.mjs
          npx electron-builder --linux AppImage --x64 --publish never 2>&1 | tee $RUNNER_TEMP/linux-build.log | tail -n 60
          node ffmpeg-pack.cjs
          ls -la out
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### Tools Linux job failed"; echo '```'; tail -n 120 $RUNNER_TEMP/linux-build.log 2>/dev/null; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/tools/desktop/out/*.AppImage
            apps/tools/desktop/out/KurokawaTools-pack-*.gz
            apps/tools/desktop/out/*.packpart.json

  # ---------- The Rust (Tauri) build: the main computer download from the switch-over on (stage P9) ----------
  # Its files never take the Electron build's names, so no Electron copy's own updater takes one by mistake:
  # KurokawaTools-<v>-windows-x64.exe (the setup program), …-windows-x64-setup.exe (the plain installer: the updater
  # and the Electron switch take this one), …-windows-x64-portable.zip, …-macos-universal.DMG, …-linux-x64.appimage,
  # …-linux-x64.deb (kt-core updatelogic.rs, desktop/rustswitch.cjs — tests/updatenames.cjs). (An Electron copy picks
  # /win-x64\.exe$/, the first /\.dmg$/ and the first /\.AppImage$/ — case-sensitive —: none of these.)
  rust-desktop:
    needs: version
    name: Rust ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, bundles: 'nsis', target: '', optional: false }
          - { name: Linux, os: ubuntu-22.04, bundles: 'appimage,deb', target: '', optional: false }
          - { name: macOS, os: macos-15, bundles: 'dmg', target: 'universal-apple-darwin', optional: true }
    defaults: { run: { shell: bash, working-directory: apps/tools } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev file
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/tools/desktop-tauri/src-tauri -> target'
          key: release-${{ matrix.target }}
      # (aria2c as the Electron build gets it — none for macOS: Homebrew's at run time —, and 7-Zip from 7zip-bin.)
      - name: aria2c and 7-Zip for the bundle
        working-directory: apps/tools/desktop
        run: |
          node fetch-aria2.mjs
          mkdir -p aria2 ../desktop-tauri/aria2
          for d in aria2/*/; do [ -d "$d" ] && cp -R "${d%/}" ../desktop-tauri/aria2/; done
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then archs="x64 arm64"; else archs=$(node -p process.arch); fi
          plat=$(node -p "({ win32: 'win', darwin: 'mac' })[process.platform] || 'linux'")
          for arch in $archs; do src="node_modules/7zip-bin/$plat/$arch"; if [ -d "$src" ]; then mkdir -p "../desktop-tauri/7zip/$plat/$arch"; cp "$src"/7za* "../desktop-tauri/7zip/$plat/$arch/"; chmod +x "../desktop-tauri/7zip/$plat/$arch/"7za* || true; fi; done
          find node_modules/7zip-bin -maxdepth 1 -type f \( -iname '*licen*' -o -iname 'copying*' \) -exec cp {} ../desktop-tauri/7zip/ \;
      # (The original system — PORTING.md «The original Rust system — piece by piece» —, chosen as tauri-check.yml does:
      # the piece not yet on by default for this system (Windows native-toast, Linux wkgtk; none for the universal Mac)
      # is checked first on the committed Cargo.toml and built in only when it compiles; never the build broken by it.)
      - name: Original system — compile try
        if: matrix.target == ''
        continue-on-error: true
        working-directory: apps/tools/desktop-tauri/src-tauri
        run: |
          case "$RUNNER_OS" in Windows) f=native-toast ;; Linux) f=wkgtk ;; *) f="" ;; esac
          if [ -z "$f" ]; then echo "nothing to try on $RUNNER_OS"; exit 0; fi
          set +e
          cargo check --release --features "$f" --message-format short > "$RUNNER_TEMP/original.log" 2>&1
          code=$?
          set -e
          grep -E 'error|KT build \(original\)|KT build \(hybrid\)' "$RUNNER_TEMP/original.log" | head -60 || true
          built=no; if [ "$code" = 0 ]; then built=yes; echo "KT_ORIGINAL=$f" >> "$GITHUB_ENV"; fi
          echo "cargo check --features $f ($RUNNER_OS): exit $code — in this release's program: $built" | tee -a "$GITHUB_STEP_SUMMARY"
      # (Stage P4's librqbit — far seeks fetch the sought place first — turned on as CI builds it (rqbit-feature.cjs); a
      # build that fails with it is made again without it, so a librqbit failure can never block the release:
      # desktop-tauri/switch-over/NOTES.md. The release notes say so when that happened.)
      - name: Build
        working-directory: apps/tools/desktop-tauri
        run: |
          npx --yes @tauri-apps/cli@^2 icon ../desktop/icon.png
          feats=""; if [ -n "${KT_ORIGINAL:-}" ]; then feats="--features $KT_ORIGINAL"; echo "with the original system's $KT_ORIGINAL"; fi
          build() { if [ -n "${{ matrix.target }}" ]; then npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }} --target ${{ matrix.target }} $feats; else npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }} $feats; fi; }
          mkdir -p "$RUNNER_TEMP/rust-note"
          node rqbit-feature.cjs on
          if build; then
            echo "librqbit: in this build (far seeks fetch the sought place first)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the build with librqbit failed — the plain build is released (aria2 streams; far seeks wait)"
            node rqbit-feature.cjs off
            build
            echo "_${{ matrix.name }}: built without librqbit this time (its build failed); seeking far ahead in a torrent you are watching waits until the download gets there._" | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/rust-note/${{ matrix.name }}.md"
          fi
      # (Windows: the installer's one screen — Tauri's own installer is kept, with a warning, if it cannot be put in.)
      - name: One-page installer
        if: runner.os == 'Windows'
        working-directory: apps/tools/desktop-tauri
        run: node src-tauri/installer/onepage.cjs src-tauri
      # (Windows: the designed setup program — desktop-tauri/setup — with the NSIS installer above embedded and run
      # silently underneath; told the program's file name Tauri gave it. Should it fail to build, the release still has
      # the plain installer, and the job says so.)
      - name: Setup program
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        working-directory: apps/tools/desktop-tauri/src-tauri
        run: |
          $inner = Get-ChildItem 'target/release/bundle/nsis/*-setup.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $inner) { throw 'no NSIS installer to embed' }
          $v = (node -p "require('../../package.json').version").Trim()
          $nsi = Get-ChildItem 'target' -Recurse -Depth 4 -Filter 'installer.nsi' -ErrorAction SilentlyContinue | Select-Object -First 1
          $main = if ($nsi) { (Select-String -Path $nsi.FullName -Pattern '^\s*!define\s+MAINBINARYNAME\s+"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value } else { '' }
          $env:KR_SETUP_APP_EXE = if ($main) { "$main.exe" } else { 'Kurokawa Tools.exe' }
          $env:KR_SETUP_INNER = $inner.FullName
          $env:KR_SETUP_APP_BYTES = "$((Get-Item 'target/release/kurokawa-tools.exe').Length)"
          $env:CARGO_TARGET_DIR = (Resolve-Path 'target').Path
          cargo build --release --manifest-path ../setup/src-tauri/Cargo.toml 2>&1 | Write-Host
          if ($LASTEXITCODE) { "::warning::the setup program did not build: the release has the plain installer only"; throw "setup program: cargo build failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force -Path 'target/release/bundle/setup' | Out-Null
          Copy-Item 'target/release/KurokawaToolsSetup.exe' "target/release/bundle/setup/KurokawaTools-$v-windows-x64.exe" -Force
      - name: Collect, under the release's names
        working-directory: apps/tools/desktop-tauri/src-tauri
        run: |
          V=${{ needs.version.outputs.v }}; mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/bundle/nsis/*-setup.exe "out/KurokawaTools-$V-windows-x64-setup.exe"
            for f in target/release/bundle/setup/*-windows-x64.exe; do [ -f "$f" ] && cp "$f" "out/KurokawaTools-$V-windows-x64.exe"; done
            p="$RUNNER_TEMP/kt-portable"; mkdir -p "$p"; cp target/release/kurokawa-tools.exe "$p/Kurokawa Tools.exe"
            for r in aria2 7zip; do [ -d "target/release/$r" ] && cp -r "target/release/$r" "$p/"; done
            echo 'This copy is portable: it never updates itself. Download the new portable zip from the release page.' > "$p/KurokawaTools.portable"
            (cd "$p" && 7z a -tzip -mx=7 "$GITHUB_WORKSPACE/apps/tools/desktop-tauri/src-tauri/out/KurokawaTools-$V-windows-x64-portable.zip" . > /dev/null)
          elif [ "$RUNNER_OS" = macOS ]; then
            cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/KurokawaTools-$V-macos-universal.DMG"
          else
            cp target/release/bundle/appimage/*.AppImage "out/KurokawaTools-$V-linux-x64.appimage"
            cp target/release/bundle/deb/*.deb "out/KurokawaTools-$V-linux-x64.deb"
          fi
          ls -la out
      - name: Sizes (for the notes' size table)
        working-directory: apps/tools/desktop-tauri/src-tauri
        run: |
          { echo "### ${{ matrix.name }} — release files"; echo; echo "| File | Size (MB) |"; echo "|---|---:|"
            for f in out/*; do b=$(wc -c < "$f" | tr -d ' '); echo "| \`$(basename "$f")\` | $(awk -v b="$b" 'BEGIN { printf "%.2f", b / 1048576 }') |"; done; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: 'rust-${{ runner.os }}', path: apps/tools/desktop-tauri/src-tauri/out/* }
      # (Only when the build fell back to the plain one: a line for the release notes, read and removed by «Release notes».)
      - uses: actions/upload-artifact@v4
        with: { name: 'note-rust-${{ runner.os }}', path: '${{ runner.temp }}/rust-note/*', if-no-files-found: ignore }

  release:
    name: Publish release
    needs: [version, web, android, windows, macos, linux, rust-desktop]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.web.result == 'success' && needs.android.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Packs file (Android's, with the desktop's ffmpeg merged in)
        run: |
          python3 - <<'PY'
          import glob, json, os
          path = 'artifacts/android/KurokawaTools-packs.json'
          m = json.load(open(path))
          for part in glob.glob('artifacts/*/*.packpart.json'):
              m['packs'].setdefault('ffmpeg', {}).update(json.load(open(part))); os.remove(part)
          json.dump(m, open(path, 'w'), indent=1)
          print(sorted(m['packs']['ffmpeg']))
          PY
      # (Step 3b of PORTING.md «What to flip»: the «deno» pack — yt-dlp's JavaScript runtime, offered by the PC app's
      # Tauri build as «Get deno» only when the release has it. deno's own release zips at one pinned version; each zip
      # is taken only when its SHA-256 matches what that release states for it — GitHub's digest of the uploaded file
      # and the release's own «<zip>.sha256sum» file, whichever are there (both: they must agree; neither: refused).
      # A zip refused or missing leaves that system out of the pack; any failure leaves the release as it was (no pack:
      # the app uses the first of deno / node / bun on the PATH, as before). Never a binary taken unverified.)
      - name: The deno pack (PC; verified against deno's release)
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}', DENO_VERSION: '2.5.0' }
        run: |
          d="$RUNNER_TEMP/deno-zips"; o="$RUNNER_TEMP/deno-out"; rm -rf "$d" "$o"; mkdir -p "$d" "$o"
          gh api "repos/denoland/deno/releases/tags/v$DENO_VERSION" > "$RUNNER_TEMP/deno-release.json"
          python3 - "$RUNNER_TEMP/deno-release.json" "$d" <<'PY'
          import hashlib, json, re, subprocess, sys
          rel, out = json.load(open(sys.argv[1])), sys.argv[2]
          assets = {a['name']: a for a in rel.get('assets', [])}
          want = ['deno-x86_64-pc-windows-msvc.zip', 'deno-x86_64-apple-darwin.zip', 'deno-aarch64-apple-darwin.zip', 'deno-x86_64-unknown-linux-gnu.zip', 'deno-aarch64-unknown-linux-gnu.zip']
          def fetch(url, path): subprocess.run(['curl', '-fsSL', '--retry', '3', '-o', path, url], check=True)
          took = 0
          for name in want:
              a = assets.get(name)
              if not a: print('not in the release:', name); continue
              refs = []
              dg = (a.get('digest') or '').lower()
              if re.fullmatch(r'sha256:[0-9a-f]{64}', dg): refs.append(('GitHub digest', dg[7:]))
              side = assets.get(name + '.sha256sum')
              if side:
                  fetch(side['browser_download_url'], f'{out}/{name}.sha256sum')
                  m = re.search(r'\b[0-9a-fA-F]{64}\b', open(f'{out}/{name}.sha256sum', errors='replace').read())
                  if m: refs.append(('.sha256sum', m.group(0).lower()))
              if not refs: print('refused (no checksum stated by the release):', name); continue
              if len({h for _, h in refs}) != 1: print('refused (the release\'s checksums disagree):', name); continue
              fetch(a['browser_download_url'], f'{out}/{name}')
              got = hashlib.sha256(open(f'{out}/{name}', 'rb').read()).hexdigest()
              if got != refs[0][1]:
                  print('refused (SHA-256 differs):', name); subprocess.run(['rm', '-f', f'{out}/{name}']); continue
              print('verified:', name, got, 'against', ', '.join(k for k, _ in refs)); took += 1
          sys.exit(0 if took else 1)
          PY
          cp artifacts/android/KurokawaTools-packs.json "$o/"
          python3 "$APP/scripts/denopack.py" "$d" "$o" "$DENO_VERSION"
          python3 -c "import json,sys; m=json.load(open(sys.argv[1])); assert m['packs'].get('deno'), 'no deno entry'" "$o/KurokawaTools-packs.json"
          cp "$o"/KurokawaTools-pack-deno-*.gz artifacts/android/ && cp "$o/KurokawaTools-packs.json" artifacts/android/KurokawaTools-packs.json
          ls -la artifacts/android | grep -E 'deno|packs.json'
      - name: Release notes
        run: |
          V=${{ needs.version.outputs.v }}
          {
            echo "## Kurokawa Tools v$V"
            echo
            echo "## What's new"
            if [ -s "$APP/docs/notes/v$V.md" ]; then cat "$APP/docs/notes/v$V.md"; else echo "- Fixes and improvements"; fi
            if [ "${{ needs.macos.result }}" != "success" ]; then echo; echo "_The previous build's macOS disk image did not come this time; the next release will carry one._"; fi
            # (The new computer build is optional on macOS: without it the previous build's DMG is the Mac download, and the
            # previous build on a Mac keeps updating as before — it offers the move only when the new DMG is there.)
            if [ ! -d artifacts/rust-macOS ]; then echo; echo "_macOS: the new, smaller build did not come this time; the Mac download is the previous build's \`*-mac-universal.dmg\`, which keeps working and updating as before._"; fi
            for os in Windows Linux; do if [ ! -d "artifacts/rust-$os" ]; then echo; echo "_$os: the new, smaller build did not come this time; the previous build stays the $os download._"; fi; done
            # (A Rust build that fell back to the plain one — without librqbit — says so.)
            for f in artifacts/note-rust-*/*.md; do [ -f "$f" ] && { echo; cat "$f"; }; done
            # (No deno pack this time — «The deno pack» refused or could not fetch deno's files: the notes' «Get deno» does not hold.)
            if ! ls artifacts/android/KurokawaTools-pack-deno-*.gz > /dev/null 2>&1; then echo; echo "_This release carries no deno pack: for YouTube's full choice of formats in the video tools on a computer, install deno or node yourself._"; fi
            echo
            echo "## Files"
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Android (most phones) | \`*-arm64-v8a.apk\` |"
            echo "| Android (older 32-bit phones) | \`*-armeabi-v7a.apk\` |"
            echo "| Android (any, larger) | \`*-universal.apk\` |"
            echo "| Android, a11y variant | \`*-a11y.apk\` — the same app with the screen translator's accessibility service (reads the screen's exact text); Google Play Protect may ask you to allow it. The ordinary APKs read the screen as a picture and install without a question |"
            echo "| Windows | \`*-windows-x64.exe\` — the installer (new and far smaller; a few seconds, no administrator rights). The classic installer is \`*-windows-x64-setup.exe\`; the portable build is \`*-windows-x64-portable.zip\` |"
            echo "| Windows (previous build, kept for two versions) | \`*-win-x64.exe\` installer, or the portable \`*-win-x64-portable.exe\` |"
            echo "| macOS | \`*-macos-universal.DMG\` (unsigned: right-click → Open the first time; torrents need \`brew install aria2\`) |"
            echo "| macOS (previous build) | \`*-mac-universal.dmg\` |"
            echo "| Linux | \`*-linux-x64.appimage\` (chmod +x, then run), or \`*-linux-x64.deb\`; the previous build: \`*-linux-x86_64.AppImage\` |"
            echo "| Android packs | \`KurokawaTools-pack-*.zip\` — Python and ffmpeg, downloaded by the app itself when an add-on needs them; nothing to install by hand |"
            echo "| Computer packs | \`KurokawaTools-pack-*.gz\` — ffmpeg, and deno when the release has it (what YouTube's formats need in the video tools), downloaded by the computer app itself when needed and checked; nothing to install by hand |"
            echo "| Web | \`KurokawaTools-web.zip\` — or https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tools/ (downloads through the browser; torrents through a remote aria2) |"
            echo
            echo "_\`*-SHA256SUMS.txt\` holds every file's SHA-256, which the computer app's updater checks before it installs anything._"
          } > notes.md
          rm -rf artifacts/note-rust-*
      # (Every file's SHA-256, under its published name: the Rust build's updater and the Electron switch refuse a file
      # that does not match.)
      - name: Checksums
        run: |
          V=${{ needs.version.outputs.v }}
          (cd artifacts && find . -type f ! -name '*.blockmap' -print0 | sort -z | xargs -0 sha256sum | sed -E 's#  \./[^/]+/#  #') > "KurokawaTools-$V-SHA256SUMS.txt"
          cat "KurokawaTools-$V-SHA256SUMS.txt"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tools-v${{ needs.version.outputs.v }}
          name: Kurokawa Tools v${{ needs.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          prerelease: true
          make_latest: false
          files: |
            artifacts/web/*
            artifacts/android/*
            artifacts/windows/*
            artifacts/macos/*
            artifacts/linux/*
            KurokawaTools-*-SHA256SUMS.txt
      # (The Rust build's files, uploaded after the others. Their names keep every Electron copy's updater off them, so
      # the order does not matter: an Electron copy takes the bridge build, which makes the hand-over and offers the move.)
      - name: The Rust build's files
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for d in artifacts/rust-*; do [ -d "$d" ] && gh release upload "tools-v${{ needs.version.outputs.v }}" "$d"/* --clobber -R "$GITHUB_REPOSITORY"; done
