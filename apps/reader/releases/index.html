<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kurokawa Releases</title>
<meta name="description" content="Download Kurokawa Reader for Android, iOS, Windows, macOS, Linux and the web — every release and its notes.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef0ff">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<style>
/* DejaVu Sans (Bitstream Vera licence), Arabic glyphs only, two static weights: 400 and 700. Latin and digits keep the page font. */
@font-face { font-family: "KR Arabic"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/DejaVuSans-arabic.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC; }
:root {
  /* A moonlit palette: blue, lavender dusk, a touch of rose — on a pale blue-lilac ground. */
  --p: #2c5aa6; --on-p: #fff; --pc: #d8e3ff; --on-pc: #0b2a5e;
  --s: #5e4f97; --scc: #e8e0ff; --on-scc: #2a1e5c;
  --t: #9a467a; --tc: #ffdcec; --on-tc: #4a1036;
  --bg-a: #eef0ff; --bg-b: #f7eef8; --bg-c: #e6efff;
  --card: rgba(255,255,255,.66); --row: rgba(255,255,255,.78); --bar: rgba(244,244,255,.74);
  --text: #0e1a33; --muted: #2f3d5c; --line: #c4cdea; --edge: rgba(255,255,255,.95);
  --shadow: 0 10px 30px -18px rgba(44,58,122,.38);
  --orb-1: rgba(120,150,230,.38); --orb-2: rgba(170,140,230,.32); --orb-3: rgba(230,150,200,.26);
  --spring: linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1);
  --ff: "Google Sans Flex", "Roboto Flex", system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Arabic", sans-serif;
  --dx: 4px;
  --cardbg: var(--card); --ring: transparent; --bf: blur(14px) saturate(1.2); --hf: blur(8px) saturate(1.2);
  --opt: #fff; --herofx: none; --cardedge: 0 1px 0 var(--edge) inset;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  /* The former dark look: neutral blue-greys, solid surfaces, one blue accent. */
  --p: #4fa3ff; --on-p: #04223f; --pc: #1c3756; --on-pc: #b9daff;
  --s: #4fa3ff; --scc: #1c3756; --on-scc: #b9daff;
  --t: #4fa3ff; --tc: #12352a; --on-tc: #6fdda9; --s3: #243042;
  --bg-a: #0d1117; --bg-b: #0d1117; --bg-c: #0d1117;
  --card: #151b24; --row: #1b2330; --bar: rgba(13,17,23,.94);
  --text: #e7edf6; --muted: #9aa8bc; --line: #2a3546; --edge: rgba(255,255,255,.06);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
  --orb-1: transparent; --orb-2: transparent; --orb-3: transparent;
  --cardbg: var(--card); --ring: transparent; --bf: none; --hf: none; --opt: #151b24;
  --herofx: radial-gradient(circle at 92% -10%, rgba(79,163,255,.13), transparent 55%);
  --cardedge: none;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  /* The former dark look: neutral blue-greys, solid surfaces, one blue accent. */
  --p: #4fa3ff; --on-p: #04223f; --pc: #1c3756; --on-pc: #b9daff;
  --s: #4fa3ff; --scc: #1c3756; --on-scc: #b9daff;
  --t: #4fa3ff; --tc: #12352a; --on-tc: #6fdda9; --s3: #243042;
  --bg-a: #0d1117; --bg-b: #0d1117; --bg-c: #0d1117;
  --card: #151b24; --row: #1b2330; --bar: rgba(13,17,23,.94);
  --text: #e7edf6; --muted: #9aa8bc; --line: #2a3546; --edge: rgba(255,255,255,.06);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
  --orb-1: transparent; --orb-2: transparent; --orb-3: transparent;
  --cardbg: var(--card); --ring: transparent; --bf: none; --hf: none; --opt: #151b24;
  --herofx: radial-gradient(circle at 92% -10%, rgba(79,163,255,.13), transparent 55%);
  --cardedge: none;
  color-scheme: dark;
}
[dir="rtl"] { --dx: -4px; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg-a); }
body { margin: 0; min-height: 100vh; color: var(--text); font: 16px/1.6 var(--ff); -webkit-font-smoothing: antialiased;
  background: linear-gradient(170deg, var(--bg-a) 0%, var(--bg-b) 46%, var(--bg-c) 100%) fixed; }
:lang(ar) { font-synthesis: weight; --ff: "KR Arabic", "DejaVu Sans", "Noto Sans Arabic", "Google Sans Flex", system-ui, -apple-system, "Segoe UI", sans-serif; }
:lang(ja) { --ff: "Google Sans Flex", "Roboto Flex", system-ui, "Hiragino Sans", "Yu Gothic UI", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; }
:lang(ko) { --ff: "Google Sans Flex", "Roboto Flex", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", "Noto Sans KR", sans-serif; }
:lang(zh) { --ff: "Google Sans Flex", "Roboto Flex", system-ui, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
a { color: var(--p); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--p); outline-offset: 3px; border-radius: 12px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Moonlit orbs and the ripple layer */
.orbs { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
  background: radial-gradient(60vmax 50vmax at 12% -8%, var(--orb-1), transparent 70%), radial-gradient(55vmax 45vmax at 98% 30%, var(--orb-2), transparent 70%), radial-gradient(50vmax 40vmax at 30% 112%, var(--orb-3), transparent 70%); }
#fx { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
#bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 10; background: var(--bar); backdrop-filter: var(--bf); -webkit-backdrop-filter: var(--bf); border-bottom: 1px solid var(--edge); }
.top .wrap { display: flex; align-items: center; gap: 10px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; color: var(--text); margin-inline-end: auto; }
.brand img { width: 32px; height: 32px; border-radius: 10px; }
.pill { height: 44px; border-radius: 22px; border: 0; background: var(--row); color: var(--text); cursor: pointer; display: inline-grid; place-items: center; transition: transform .5s var(--spring), border-radius .5s var(--spring); }
.pill:hover { border-radius: 14px; }
.pill:active { transform: scale(.93); }
.icon-btn { width: 44px; }
.icon-btn svg { width: 20px; height: 20px; }
.sel { position: relative; display: inline-flex; align-items: center; }
.sel select { appearance: none; -webkit-appearance: none; height: 44px; border-radius: 22px; border: 0; background: var(--row); cursor: pointer; font-weight: 600; padding-block: 0; padding-inline: 38px 16px; transition: border-radius .5s var(--spring); }
.sel select:hover { border-radius: 14px; }
.sel svg { position: absolute; inset-inline-start: 12px; width: 18px; height: 18px; pointer-events: none; color: var(--p); }
.sel option { color: var(--text); background: var(--opt); }

/* Cards */
.card { background: var(--cardbg); border: 1px solid transparent; border-radius: 32px; box-shadow: var(--cardedge), var(--shadow); transition: border-radius .6s var(--spring); }
.card:hover { border-radius: 44px; }

/* Hero */
.hero { position: relative; margin: 20px 0 8px; padding: 32px; backdrop-filter: var(--hf); -webkit-backdrop-filter: var(--hf); }
.hero::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--herofx); pointer-events: none; }
.hero-in { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: center; }
.emblem { position: relative; width: 148px; height: 148px; cursor: pointer; }
.emblem .blob { position: absolute; inset: 0; background: conic-gradient(from 0deg, var(--p), var(--s), var(--t), var(--s), var(--p)); clip-path: var(--cookie, circle(50%)); animation: spin 28s linear infinite; transition: clip-path .9s var(--spring); }
.emblem .face { position: absolute; inset: 9%; display: grid; place-items: center; background: var(--pc); clip-path: var(--cookie, circle(50%)); transition: clip-path .9s var(--spring); }
.emblem .face img { width: 70%; height: 70%; border-radius: 22%; display: block; }
.emblem:hover .face, .emblem.morph .face { clip-path: var(--flower, circle(50%)); }
.emblem:hover .blob, .emblem.morph .blob { clip-path: var(--flower, circle(50%)); }
@keyframes spin { to { transform: rotate(1turn); } }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--s); }
.eyebrow svg { width: 18px; height: 18px; }
.hero h1 { margin: .2em 0 .15em; font-size: clamp(32px, 7vw, 56px); line-height: 1; letter-spacing: -.02em; font-weight: 780; font-variation-settings: "wght" 800, "wdth" 104, "ROND" 100; overflow-wrap: anywhere; }
.tag { position: relative; margin: 0; padding-inline-start: 18px; color: var(--muted); font-size: clamp(16px, 2.6vw, 19px); line-height: 1.55; max-width: 52ch; }
.tag::before { content: ""; position: absolute; inset-inline-start: 0; top: .2em; bottom: .2em; width: 5px; border-radius: 5px; background: linear-gradient(var(--p), var(--t)); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; border-radius: 999px; background: var(--pc); color: var(--on-pc); box-shadow: inset 0 0 0 1px var(--ring); font-size: 14px; font-weight: 600; }
.chip.ghost { background: var(--scc); color: var(--on-scc); font-weight: 500; }
.cta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.btn { appearance: none; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 26px; border-radius: 28px; cursor: pointer; text-decoration: none; font-weight: 600; font-size: 16px; line-height: 1.2;
  background: var(--p); color: var(--on-p); transition: border-radius .5s var(--spring), transform .5s var(--spring); }
.btn:hover { border-radius: 16px; }
.btn:active { transform: scale(.94); border-radius: 12px; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn small { font-weight: 500; opacity: .85; font-size: 14px; }
.btn.ton { background: var(--scc); color: var(--on-scc); box-shadow: inset 0 0 0 1px var(--ring); }

/* Section titles */
h2 { scroll-margin-top: 84px; display: flex; align-items: center; gap: 10px; font-size: 24px; line-height: 1.15; margin: 40px 0 14px; letter-spacing: -.01em; font-weight: 740; font-variation-settings: "wght" 740, "wdth" 105, "ROND" 100; }
h2 svg { width: 22px; height: 22px; color: var(--t); flex: none; }

/* Platforms */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.plat { min-width: 0; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.plat.mine { border: 2px solid color-mix(in srgb, var(--p) 60%, transparent); padding: 19px; }
.plat-h { display: flex; align-items: center; gap: 14px; }
.badge-ic { width: 48px; height: 48px; display: grid; place-items: center; flex: none; background: var(--p); color: var(--on-p); clip-path: var(--cookie, circle(50%)); transition: clip-path .7s var(--spring); }
.plat:nth-child(3n+2) .badge-ic { background: var(--s); color: var(--on-p); }
.plat:nth-child(3n) .badge-ic { background: var(--t); color: var(--on-p); }
.plat:hover .badge-ic, .plat:focus-within .badge-ic { clip-path: var(--flower, circle(50%)); }
.badge-ic svg { width: 24px; height: 24px; }
.plat h3 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 700; font-variation-settings: "wght" 700, "ROND" 100; }
.plat .you { font-size: 13px; font-weight: 600; color: var(--p); }
.rows { display: grid; gap: 4px; }
.file { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); padding: 12px 14px; background: var(--row); border-radius: 8px; min-width: 0; transition: border-radius .5s var(--spring), transform .5s var(--spring); }
.rows > .file:first-child { border-start-start-radius: 22px; border-start-end-radius: 22px; }
.rows > .file:last-child { border-end-start-radius: 22px; border-end-end-radius: 22px; }
.rows > .file:only-child { border-radius: 22px; }
.file:hover { border-radius: 22px; background: var(--pc); color: var(--on-pc); transform: translateX(var(--dx)); }
.file .t { flex: 1; min-width: 0; }
.file b { display: block; font-weight: 650; font-size: 15px; overflow-wrap: anywhere; }
.file .sub { display: block; color: var(--muted); font-size: 13px; line-height: 1.45; }
.file:hover .sub { color: inherit; opacity: .85; }
.file .sz { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; direction: ltr; }
.file:hover .sz { color: inherit; }
.file svg { width: 18px; height: 18px; flex: none; color: var(--p); }
.file:hover svg { color: inherit; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.copy { display: flex; gap: 8px; align-items: center; background: var(--row); border-radius: 18px; padding: 6px; padding-inline-start: 14px; }
.copy code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; direction: ltr; text-align: left; }
.copy button { border: 0; background: var(--scc); color: var(--on-scc); border-radius: 14px; min-height: 40px; padding: 0 16px; cursor: pointer; font-weight: 600; font-size: 14px; flex: none; transition: border-radius .5s var(--spring), transform .5s var(--spring); }
.copy button:hover { border-radius: 10px; }
.copy button:active { transform: scale(.94); }

/* Releases */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 40px 0 14px; }
.bar h2 { margin: 0; margin-inline-end: auto; }
.search { box-shadow: inset 0 0 0 1px var(--ring); display: flex; align-items: center; gap: 8px; background: var(--row); border-radius: 22px; padding: 0 16px; min-width: 0; flex: 0 1 320px; transition: border-radius .5s var(--spring); }
.search:hover, .search:focus-within { border-radius: 14px; }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { border: 0; background: transparent; outline: none; padding: 0; min-height: 44px; width: 100%; min-width: 0; }
.search:focus-within { outline: 3px solid var(--p); outline-offset: 3px; }
.count { color: var(--muted); font-size: 14px; width: 100%; margin-top: -4px; }
.rel { min-width: 0; margin-bottom: 14px; padding: 6px 6px 8px; scroll-margin-top: 84px; }
.rel-h { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 16px 18px 8px; }
.rel-h h3 { margin: 0; font-size: 24px; line-height: 1.1; direction: ltr; font-weight: 760; font-variation-settings: "wght" 760, "wdth" 104, "ROND" 100; }
.rel-h .date { color: var(--muted); font-size: 14px; margin-inline-start: auto; }
.tagb { font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 999px; background: var(--p); color: var(--on-p); }
.tagb.pre { background: var(--scc); color: var(--on-scc); }
details.fold { margin: 4px 6px 0; background: var(--row); border-radius: 22px; transition: border-radius .5s var(--spring); }
details.fold:hover, details.fold[open] { border-radius: 26px; }
details.fold > summary { list-style: none; cursor: pointer; min-height: 52px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; font-weight: 650; color: var(--p); border-radius: inherit; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .chev { width: 18px; height: 18px; flex: none; transition: transform .6s var(--spring); }
details.fold[open] > summary .chev { transform: rotate(180deg); }
details.fold > summary .gh { margin-inline-start: auto; font-weight: 500; font-size: 14px; }
details.fold[open] > .panel { animation: pop .65s var(--spring) both; transform-origin: top center; }
@keyframes pop { from { opacity: 0; transform: translateY(-10px) scale(.97); } to { opacity: 1; transform: none; } }
.notes { padding: 0 18px 12px; direction: ltr; text-align: left; }
.notes h4 { display: inline-flex; align-items: center; gap: 6px; margin: 12px 0 6px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; padding: 3px 12px; border-radius: 10px; background: var(--pc); color: var(--on-pc); }
.notes h4.fix { background: var(--tc); color: var(--on-tc); }
.notes h4.new { background: var(--scc); color: var(--on-scc); }
.notes ul { margin: 0; padding-inline-start: 20px; }
.notes li { margin: 6px 0; }
.notes li::marker { color: var(--s); }
.notes p { margin: 8px 0; }
.notes code { background: var(--pc); color: var(--on-pc); padding: 1px 6px; border-radius: 6px; font-size: .9em; }
.flist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 4px; padding: 0 10px 12px; }
.flist .file { background: var(--card); border-radius: 12px; }
.flist .file:hover { border-radius: 22px; background: var(--pc); }
.flist .file b { direction: ltr; text-align: start; font-size: 14px; }
.flist .hint { grid-column: 1 / -1; margin-top: 8px; padding-inline: 6px; }
.more { display: flex; justify-content: center; margin: 8px 0 24px; }
.empty, .error { text-align: center; color: var(--muted); padding: 40px 16px; background: var(--card); border-radius: 28px; }
footer { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 16px 56px; }
.skel { height: 150px; border-radius: 32px; background: var(--card); margin-bottom: 14px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01s !important; }
}
@media (max-width: 640px) {
  .hero { padding: 24px 18px; }
  .hero-in { grid-template-columns: 1fr; gap: 18px; }
  .emblem { width: 112px; height: 112px; }
  .brand span { display: none; }
  .search { flex: 1 1 100%; }
  .cta .btn { flex: 1 1 100%; }
  .rel-h .date { width: 100%; margin: 0; }
  .rel-h h3 { font-size: 22px; }
}
/*DARKLOOK*/
/* Dark: the former page look, reproduced on the same markup. */
@media (prefers-color-scheme: dark) {
:root:not([data-theme="light"]) .wrap { max-width: 1040px; }
:root:not([data-theme="light"]) .top { background: color-mix(in srgb, #0d1117 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid color-mix(in srgb, #2a3546 60%, transparent); }
:root:not([data-theme="light"]) .brand img { border-radius: 9px; box-shadow: var(--shadow); }
:root:not([data-theme="light"]) .pill,
:root:not([data-theme="light"]) .sel select { height: 40px; border-radius: 999px; background: var(--row); }
:root:not([data-theme="light"]) .pill:hover,
:root:not([data-theme="light"]) .sel select:hover { border-radius: 999px; background: var(--s3); }
:root:not([data-theme="light"]) .icon-btn { width: 40px; }
:root:not([data-theme="light"]) .sel svg { display: none; }
:root:not([data-theme="light"]) .sel select { padding-inline: 14px; font-weight: 600; text-align: center; text-align-last: center; }
:root:not([data-theme="light"]) .card,
:root:not([data-theme="light"]) .card:hover { border: 2px solid transparent; border-radius: 24px; box-shadow: var(--shadow); }
:root:not([data-theme="light"]) .hero,
:root:not([data-theme="light"]) .hero:hover { margin: 24px 0 8px; padding: 40px 32px; border-radius: 32px; overflow: hidden; }
:root:not([data-theme="light"]) .hero::before,
:root:not([data-theme="light"]) .hero::after { content: ""; position: absolute; inset: auto; border-radius: 50%; filter: blur(2px); opacity: .55; pointer-events: none; }
:root:not([data-theme="light"]) .hero::before { width: 420px; height: 420px; inset-inline-end: -140px; top: -180px; background: radial-gradient(circle at 30% 30%, #8ccbff, transparent 65%); }
:root:not([data-theme="light"]) .hero::after { width: 320px; height: 320px; inset-inline-end: 120px; bottom: -220px; background: radial-gradient(circle, color-mix(in srgb, #4fa3ff 55%, transparent), transparent 70%); }
:root:not([data-theme="light"]) .hero-in { gap: 28px; }
:root:not([data-theme="light"]) .emblem { width: 112px; height: 112px; transition: transform .5s var(--spring); }
:root:not([data-theme="light"]) .emblem:hover { transform: scale(1.04); }
:root:not([data-theme="light"]) .emblem .blob { display: none; }
:root:not([data-theme="light"]) .emblem .face,
:root:not([data-theme="light"]) .emblem:hover .face,
:root:not([data-theme="light"]) .emblem.morph .face { inset: 0; clip-path: none; border-radius: 30px; background: #fff; box-shadow: 0 10px 30px rgba(31,127,224,.28); }
:root:not([data-theme="light"]) .emblem .face img { width: 100%; height: 100%; border-radius: 30px; }
:root:not([data-theme="light"]) .eyebrow { display: none; }

  const REPO = 'YoRu72/KurokawaReader';

  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage blocked */ } } };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');

  // ── Shapes for the morphing badges: a cookie and a flower, the same number of points so they blend ───────
  const shape = (n, a) => { const pts = []; for (let i = 0; i < 96; i++) { const th = (i / 96) * Math.PI * 2, r = 43 + a * Math.cos(n * th); pts.push(`${(50 + r * Math.cos(th)).toFixed(2)}% ${(50 + r * Math.sin(th)).toFixed(2)}%`); } return `polygon(${pts.join(',')})`; };
  document.documentElement.style.setProperty('--cookie', shape(9, 3));
  document.documentElement.style.setProperty('--flower', shape(6, 7));

  // ── Words ───────────────────────────────────────────────────────────────────────────────────────────────
  const arCount = (n, [one, two, few, many]) => { if (n === 0) return `لا ${few}`; if (n === 1) return one; if (n === 2) return two; const r = n % 100; return r >= 3 && r <= 10 ? `${num(n)} ${few}` : `${num(n)} ${many}`; };

    ar: {
      reader: 'قارئ كروكاوا', eyebrow: 'كروكاوا', title: (n) => `إصدارات ${n}`,
      tag: 'قراءةٌ بلا اتصال لملفات EPUB وPDF وWord والقصص المصوَّرة وغيرها، في مكتبةٍ واحدة هادئة.',
      version: 'الإصدار', published: 'صدر', latest: 'الأحدث', pre: 'تجريبي',

      const h = /^#{2,4}\s+(.*)$/.exec(line);
      if (h) { flush(); close(0); const w = h[1].trim(); const k = /^fix/i.test(w) ? 'fix' : /^new|^added/i.test(w) ? 'new' : ''; const label = k === 'fix' ? t('fixes') : k === 'new' ? t('new') : w; html += `<h4 class="${k}" dir="auto">${esc(label)}</h4>`; continue; }
      const li = /^(\s*)[-*]\s+(.*)$/.exec(line);
      if (li) {
        flush(); const depth = Math.floor(li[1].length / 2) + 1;
        if (depth > stack.length) { while (stack.length < depth) { html += '<ul><li>'; stack.push(1); } }
        else { close(depth); html += '</li><li>'; }
        html += inline(li[2]); continue;
      }
      if (/^\|/.test(line)) continue;
      if (stack.length && /^\s+/.test(raw)) { html += ' ' + inline(line.trim()); continue; }
      close(0); para.push(line.trim());
    }
    flush(); close(0); return html;
  };

  // ── State and drawing ───────────────────────────────────────────────────────────────────────────────────
  let data = null; const app = 'reader';
  let shown = 8; let query = '';
  const $ = (id) => document.getElementById(id);
  // (An app whose every release is marked «pre-release» on GitHub — so that the other app stays GitHub's «latest» —: none taken as one.)
  const list = () => { const rs = (data?.releases ?? []).filter((r) => r.app === app); return rs.some((r) => !r.pre) ? rs : rs.map((r) => ({ ...r, pre: false })); };
  // (Which notes panels the visitor has toggled, kept across redraws.)
  const openNotes = new Map();

  function chrome() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t('title')(t('reader'));
    const meta = document.querySelector('meta[name="description"]'); if (meta) meta.content = t('tag');
    $('langSel').value = lang; $('langSel').setAttribute('aria-label', $('langSel').selectedOptions[0].textContent);
    const th = store.get('kr.rel.theme') || 'auto';
    $('themeBtn').innerHTML = th === 'dark' ? I.moon : th === 'light' ? I.sun : I.auto;
    $('themeBtn').title = `${t('theme')}: ${t('theme' + th[0].toUpperCase() + th.slice(1))}`; $('themeBtn').setAttribute('aria-label', $('themeBtn').title);
    $('appName').textContent = t('reader'); $('eyebrow').textContent = t('eyebrow'); $('brandName').textContent = t('eyebrow'); $('tagline').textContent = t('tag');
    $('platTitle').innerHTML = `${I.spark}<span>${esc(t('platforms'))}</span>`; $('listTitle').textContent = t('releases');
    $('q').placeholder = t('search'); $('searchLabel').textContent = t('search'); $('moreBtn').textContent = t('more');
    $('foot').innerHTML = `${esc(t('foot'))} <a href="https://github.com/${REPO}">GitHub</a>${data?.made ? ` · ${esc(t('made'))} ${esc(date(data.made))}` : ''}`;
  }

  function hero() {
    const rs = list(); const r = rs.find((x) => !x.pre) ?? rs[0];
    if (!r) { $('heroMeta').innerHTML = ''; $('cta').innerHTML = ''; return; }
    $('heroMeta').innerHTML = `<span class="chip">${esc(t('version'))} <bdi dir="ltr">${esc(r.version)}</bdi></span><span class="chip ghost">${esc(t('published'))} ${esc(ago(r.date))}</span>`;
    const pick = (p) => r.assets.filter((a) => kindOf(a.name, r)[0] === p).sort((a, b) => (ORDER[kindOf(a.name, r)[1]] ?? 9) - (ORDER[kindOf(b.name, r)[1]] ?? 9))[0];
    let main = '';
    if (mine === 'web' || (mine === 'ios' && !pick('ios'))) main = `<a class="btn" href="${SITE}">${I.open}<span>${esc(t('openWeb'))}</span></a>`;
    else { const a = pick(mine); if (a) main = `<a class="btn" href="${esc(a.url)}" rel="nofollow">${I.down}<span>${esc(t('dl')(t(mine)))} <small>· <bdi dir="ltr">${size(a.size)}</bdi></small></span></a>`; }
    $('cta').innerHTML = `${main}<a class="btn ton" href="#plats" id="toPlats">${esc(t('allPlatforms'))}</a><a class="btn ton" href="${esc(r.url)}">${esc(t('viewGh'))}</a>`;
    $('toPlats').onclick = (e) => { e.preventDefault(); $('platTitle').scrollIntoView({ behavior: reduce.matches ? 'auto' : 'smooth', block: 'start' }); };
  }

  function platforms() {
    const rs = list(); const r = rs.find((x) => !x.pre) ?? rs[0];
    if (!r) { $('plats').innerHTML = ''; return; }
    const by = {}; for (const a of r.assets) { const [p, k] = kindOf(a.name, r); (by[p] ??= []).push([k, a]); }
    const tail = (a) => a.name.replace(/^.*?-\d[\d.]*-/, '');
    let html = '';
    for (const [p, ic] of PLATS) {
      const files = (by[p] ?? []).sort((x, y) => (ORDER[x[0]] ?? 9) - (ORDER[y[0]] ?? 9));
      if (!files.length && p !== 'web') continue;
      let rows = '', after = '';
      if (p === 'android') { rows = files.map(([k, a]) => fileLink(a, tail(a).replace(/\.apk$/, ''), t(k))).join(''); after = `<p class="hint">${esc(t('androidHint'))}</p>`; }
      else if (p === 'ios') { rows = files.map(([, a]) => fileLink(a, 'IPA', t('ipa'))).join(''); after = `<p class="hint">${esc(t('altstore'))}</p><div class="copy"><code>${esc(ALTSTORE)}</code><button type="button" data-copy="${esc(ALTSTORE)}">${esc(t('copy'))}</button></div>`; }
      else if (p === 'web') rows = `<a class="file" href="${SITE}">${I.open}<span class="t"><b>${esc(t('openWeb'))}</b><span class="sub">${esc(t('webApp'))}</span></span></a>` + files.map(([k, a]) => fileLink(a, a.name, t(k))).join('');
      else rows = files.map(([k, a]) => fileLink(a, k === 'installer' ? t('installer') : k === 'classic' ? t('classic') : k === 'portable' ? t('portableName') : k === 'appimage' ? 'AppImage' : k === 'deb' ? '.deb' : k === 'dmg' ? 'DMG' : k.startsWith('old') ? t('oldBuild') : tail(a),
        k === 'portable' ? t('portable') : k === 'installer' ? t('installerSub') : k === 'classic' ? t('classicSub') : k.startsWith('old') ? `${t('oldSub')} · ${tail(a)}` : t(k))).join('');
      html += `<section class="card plat${p === mine ? ' mine' : ''}"><div class="plat-h"><div class="badge-ic">${I[ic]}</div><div><h3>${esc(t(p))}</h3>${p === mine ? `<div class="you">${esc(t('thisDevice'))}</div>` : ''}</div></div><div class="rows">${rows}</div>${after}</section>`;
    }
    $('plats').innerHTML = html;
  }

  function releases() {
    const q = query.trim().toLowerCase();
    const all = list(); const rs = q ? all.filter((r) => r.version.includes(q) || r.notes.toLowerCase().includes(q)) : all;
    const latest = all.find((x) => !x.pre);
    $('count').textContent = q ? t('matchCount')(rs.length) : t('relCount')(all.length);
    if (!rs.length) { $('list').innerHTML = `<div class="empty">${esc(t('none'))}</div>`; $('moreBtn').hidden = true; return; }
    $('list').innerHTML = rs.slice(0, shown).map((r, i) => {
      const groups = {}; for (const a of r.assets) { const [p, k] = kindOf(a.name, r); (groups[p] ??= []).push([k, a]); }
      const main = r.assets.filter((a) => !['updater', 'packs'].includes(kindOf(a.name, r)[0]));
      const files = main.map((a) => { const [p, k] = kindOf(a.name, r); return fileLink(a, a.name, p === 'other' ? '' : `${t(p)}${k && T[lang][k] && p !== 'web' ? ' — ' + t(k) : ''}`); }).join('');
      const extra = [['packs', 'packs'], ['updater', 'updater']].map(([g, l]) => groups[g]?.length ? `<p class="hint">${esc(t(l))}</p>` + groups[g].map(([, a]) => fileLink(a, a.name, '')).join('') : '').join('');
      const noteOpen = openNotes.has(r.tag) ? openNotes.get(r.tag) : i === 0 && !q;
      return `<article class="card rel" id="${esc(r.tag)}"><div class="rel-h"><h3>${esc(r.version)}</h3>${r === latest ? `<span class="tagb">${esc(t('latest'))}</span>` : ''}${r.pre ? `<span class="tagb pre">${esc(t('pre'))}</span>` : ''}<span class="date" title="${esc(new Date(r.date).toISOString())}">${esc(date(r.date))}</span></div>`
        + (r.notes ? `<details class="fold" data-tag="${esc(r.tag)}"${noteOpen ? ' open' : ''}><summary>${I.chev}<span>${esc(t('notes'))}</span></summary><div class="panel notes">${md(r.notes)}</div></details>` : '')
        + `<details class="fold"><summary>${I.chev}<span>${esc(t('fileCount')(r.assets.length))}</span><a class="gh" href="${esc(r.url)}">${esc(t('viewGh'))}</a></summary><div class="panel flist">${files}${extra}</div></details></article>`;
    }).join('');
    $('moreBtn').hidden = rs.length <= shown;
  }

  function draw() { chrome(); hero(); platforms(); releases(); }

  // ── Events ──────────────────────────────────────────────────────────────────────────────────────────────
  $('langSel').onchange = (e) => { lang = e.target.value; store.set('kr.rel.lang', lang); draw(); };
  const applyTheme = () => { const th = store.get('kr.rel.theme') || 'auto'; if (th === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th); };
  $('themeBtn').onclick = () => { const order = ['auto', 'light', 'dark']; const th = store.get('kr.rel.theme') || 'auto'; store.set('kr.rel.theme', order[(order.indexOf(th) + 1) % 3]); applyTheme(); chrome(); recolor(); };
  let timer; $('q').addEventListener('input', (e) => { clearTimeout(timer); timer = setTimeout(() => { query = e.target.value; shown = 8; releases(); }, 120); });
  $('moreBtn').onclick = () => { shown += 10; releases(); };
  $('brand').onclick = (e) => { e.preventDefault(); scrollTo({ top: 0, behavior: reduce.matches ? 'auto' : 'smooth' }); };
  $('emblem').onclick = () => $('emblem').classList.toggle('morph');
  $('list').addEventListener('toggle', (e) => { const d = e.target; if (d.dataset?.tag) openNotes.set(d.dataset.tag, d.open); }, true);
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-copy]'); if (!b) return;
    const done = () => { b.textContent = t('copied'); setTimeout(() => { b.textContent = t('copy'); }, 1500); };
    (navigator.clipboard?.writeText(b.dataset.copy) ?? Promise.reject()).then(done).catch(() => { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
  });

  // ── The sky: drifting motes (stars in the dark, moon-dust in the light) and the tap ripple, one loop ──────
  // One requestAnimationFrame loop draws both canvases; it sleeps while the tab is hidden and is off under
  // reduced motion (a still field is painted once). Nothing in the loop reads layout.
  const bg = $('bg'), bx = bg.getContext('2d'), cv = $('fx'), cx = cv.getContext('2d');
  const darkMq = matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => { const th = store.get('kr.rel.theme') || 'auto'; return th === 'dark' || (th !== 'light' && darkMq.matches); };
  let W = 0, H = 0, sy = 0, px = 0, py = 0, pin = false, raf = 0, last = 0, rips = [], fxDirty = false;
  let motes = [], spr = [], dark = false, AM = 1, tint = '#2c5aa6', shoot = null, nextShoot = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const sprite = (rgb, core) => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, core ? 'rgba(255,255,255,1)' : `rgba(${rgb},.9)`); r.addColorStop(.16, `rgba(${rgb},${core ? .85 : .55})`); r.addColorStop(.5, `rgba(${rgb},.15)`); r.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = r; g.fillRect(0, 0, 64, 64); return c; };
  const mote = () => { const z = rnd(.25, 1); return { x: rnd(0, W), y: rnd(0, H), z, s: 3 + z * z * 11 + rnd(0, 2), a: .3 + .7 * z * rnd(.6, 1), c: (Math.random() * 3) | 0, tw: Math.random() < .3 ? rnd(.8, 2.2) : 0, ph: rnd(0, 6.28), vx: rnd(-5, 5) * z, vy: -rnd(3, 11) * z, ox: 0, oy: 0, wx: 0, wy: 0 }; };
  const want = () => Math.min(W < 640 ? 60 : 140, Math.round(W * H / 5500));
  const fit = () => {
    W = innerWidth; H = innerHeight; const d = Math.min(devicePixelRatio || 1, 2);
    for (const c of [bg, cv]) { c.width = Math.round(W * d); c.height = Math.round(H * d); c.style.width = W + 'px'; c.style.height = H + 'px'; c.getContext('2d').setTransform(d, 0, 0, d, 0, 0); }
    const n = want(); while (motes.length < n) motes.push(mote()); motes.length = n; sy = scrollY;
    if (reduce.matches && spr.length) paint(0, 0);
  };
  const recolor = () => {
    dark = isDark(); AM = dark ? 1 : .62;
    spr = (dark ? ['150,185,255', '190,172,255', '150,230,190'] : ['70,110,200', '120,96,200', '190,90,150']).map((c) => sprite(c, dark));
    tint = getComputedStyle(document.documentElement).getPropertyValue('--p').trim() || tint;
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg-a').trim() || (dark ? '#0d1117' : '#eef0ff');
    if (!dark) shoot = null; if (reduce.matches) paint(0, 0);
  };
  const paint = (now, dt) => {
    bx.clearRect(0, 0, W, H);
    const live = rips.length > 0; const push = pin || live;
    for (const m of motes) {
      m.x += m.vx * dt; m.y += m.vy * dt; if (m.x < -20) m.x = W + 20; else if (m.x > W + 20) m.x = -20;
      const by = (((m.y - sy * m.z * .35) % H) + H) % H;
      if (dt && (push || m.ox || m.oy)) {
        let ax = -m.ox * 5 - m.wx * 3.2, ay = -m.oy * 5 - m.wy * 3.2; const X = m.x + m.ox, Y = by + m.oy;
        if (pin) { const dx = X - px, dy = Y - py, d2 = dx * dx + dy * dy; if (d2 < 16900 && d2 > 1) { const d = Math.sqrt(d2), f = 1 - d / 130; ax += dx / d * f * 240 * m.z; ay += dy / d * f * 240 * m.z; } }
        for (const r of rips) { const k = (now - r.t) / 800, rr = 24 + 150 * (1 - (1 - k) ** 3), dx = X - r.x, dy = Y - r.y, d = Math.hypot(dx, dy) || 1, w = 1 - Math.abs(d - rr) / 30; if (w > 0) { const f = w * (1 - k) * 1500 * m.z; ax += dx / d * f; ay += dy / d * f; } }
        m.wx += ax * dt; m.wy += ay * dt; m.ox += m.wx * dt; m.oy += m.wy * dt;
        if (!push && Math.abs(m.ox) + Math.abs(m.oy) + Math.abs(m.wx) + Math.abs(m.wy) < .05) m.ox = m.oy = m.wx = m.wy = 0;
      }
      let al = m.a * AM; if (m.tw) al *= .7 + .3 * Math.sin(now * .001 * m.tw + m.ph);
      bx.globalAlpha = al; bx.drawImage(spr[m.c], m.x + m.ox - m.s, by + m.oy - m.s, m.s * 2, m.s * 2);
    }
    bx.globalAlpha = 1;
    if (dark && dt) {
      if (!shoot && now > nextShoot) { shoot = { x: rnd(.1, .7) * W, y: rnd(0, .35) * H, t: now }; nextShoot = now + rnd(7000, 15000); }
      if (shoot) { const k = (now - shoot.t) / 1200; if (k >= 1) shoot = null; else { const hx = shoot.x + 520 * k * 1.2 * .9, hy = shoot.y + 520 * k * 1.2 * .42, g = bx.createLinearGradient(hx, hy, hx - 110, hy - 50); g.addColorStop(0, `rgba(235,242,255,${.8 * Math.sin(k * 3.1416)})`); g.addColorStop(1, 'rgba(160,190,255,0)'); bx.strokeStyle = g; bx.lineWidth = 1.5; bx.beginPath(); bx.moveTo(hx, hy); bx.lineTo(hx - 110, hy - 50); bx.stroke(); } }
    }
    if (live || fxDirty) {
      cx.clearRect(0, 0, W, H); rips = rips.filter((r) => now - r.t < 800);
      for (const r of rips) { const k = (now - r.t) / 800, e = 1 - (1 - k) ** 3; cx.globalAlpha = .2 * (1 - k); cx.fillStyle = tint; cx.beginPath(); cx.arc(r.x, r.y, 24 + 150 * e, 0, 6.2832); cx.fill(); }
      cx.globalAlpha = 1; fxDirty = rips.length > 0;
    }
  };
  const frame = (now) => { const dt = Math.min(.05, (now - last) / 1000) || .016; last = now; paint(now, dt); raf = requestAnimationFrame(frame); };
  const start = () => { if (!raf && !document.hidden && !reduce.matches) { last = performance.now(); raf = requestAnimationFrame(frame); } };
  const stop = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } };
  addEventListener('pointerdown', (e) => { if (reduce.matches) return; rips.push({ x: e.clientX, y: e.clientY, t: performance.now() }); if (rips.length > 5) rips.shift(); fxDirty = true; px = e.clientX; py = e.clientY; start(); }, { passive: true });
  addEventListener('pointermove', (e) => { px = e.clientX; py = e.clientY; pin = e.pointerType === 'mouse'; }, { passive: true });
  addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') pin = false; }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => { pin = false; });
  addEventListener('scroll', () => { sy = scrollY; }, { passive: true });
  addEventListener('resize', fit);
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else start(); });
  const motion = () => { if (reduce.matches) { stop(); rips = []; cx.clearRect(0, 0, W, H); paint(0, 0); } else start(); };
  reduce.addEventListener?.('change', motion); darkMq.addEventListener?.('change', () => { recolor(); });

  applyTheme(); chrome(); fit(); recolor(); motion();

  // ── Data: the list made when the site was published; GitHub's own as a fallback ──────────────────────────
  const fromGitHub = async () => {
    const res = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`); if (!res.ok) throw new Error(res.status);
    const raw = await res.json();
    const out = raw.filter((r) => !r.draft && /^v\d/.test(r.tag_name)).map((r) => {
      const body = (r.body ?? '').replace(/\r/g, ''); let notes = body; const at = body.search(/^## What's new\s*$/m);
      if (at >= 0) { notes = body.slice(at).replace(/^## What's new\s*\n/, ''); const end = notes.search(/^## /m); if (end >= 0) notes = notes.slice(0, end); }
      return { app: r.tag_name.startsWith('tools-') ? 'tools' : 'reader', version: r.tag_name.replace(/^tools-/, '').replace(/^v/, ''), tag: r.tag_name, date: r.published_at, pre: r.prerelease, url: r.html_url, notes: notes.trim(), assets: r.assets.map((a) => ({ name: a.name, size: a.size, url: a.browser_download_url, n: a.download_count })) };
    });
    return { made: new Date().toISOString(), releases: out };
  };
  fetch('releases.json', { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(fromGitHub)
    .then((d) => { data = d; draw(); const id = decodeURIComponent(location.hash.slice(1)); if (id && id !== 'plats') { const el = document.getElementById(id); if (el) el.scrollIntoView(); } })
    .catch(() => { $('list').innerHTML = `<div class="error">${esc(t('error'))} <a href="https://github.com/${REPO}/releases">github.com/${REPO}/releases</a></div>`; $('count').textContent = ''; });
})();
</script>
</body>
</html>
