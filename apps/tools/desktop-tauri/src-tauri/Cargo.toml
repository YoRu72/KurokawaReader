[package]
name = "kurokawa-tools"
# (Not the app's version: Tauri takes that from tauri.conf.json, which reads apps/tools/package.json.)
version = "0.0.0"
description = "Kurokawa Tools — the Tauri shell (stage 1)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
