name: Release

# Every push to main builds all platforms and publishes (or refreshes) the
# GitHub Release named after package.json's version, e.g. v0.2.0.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "v=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Repository topics
        continue-on-error: true
        env: { GH_TOKEN: '${{ secrets.REPO_ADMIN_TOKEN || github.token }}' }
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/topics" -H "Accept: application/vnd.github+json" \
            --input - <<'JSON'
          {"names":["ebook-reader","epub-reader","pdf-reader","reader","android","ios","windows","macos","linux","electron","capacitor","pwa","typescript","arabic","rtl","epub","pdf","docx","material-design-3","offline-first"]}
          JSON

  web:
    name: Web build & tests
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Package web build
        run: cd dist && zip -r ../KurokawaReader-web.zip . && cd ..
      - uses: actions/upload-artifact@v4
        with: { name: web, path: KurokawaReader-web.zip }

  android:
    needs: version
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - name: Accept Android SDK licences (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create Android project
        shell: bash
        run: |
          set -o pipefail
          { npx cap add android && node native/android/overlay.mjs && npx cap sync android; } 2>&1 | tee $RUNNER_TEMP/android-prepare.log
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > $RUNNER_TEMP/kr.keystore
            # Alias and key password default sensibly when only the keystore + its password are set.
            SP='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
            AL='${{ secrets.ANDROID_KEY_ALIAS }}'; [ -n "$AL" ] || AL=kurokawa
            KP='${{ secrets.ANDROID_KEY_PASSWORD }}'; [ -n "$KP" ] || KP="$SP"
            echo "KR_KEYSTORE_PASSWORD=$SP" >> $GITHUB_ENV
            echo "KR_KEY_ALIAS=$AL" >> $GITHUB_ENV
            echo "KR_KEY_PASSWORD=$KP" >> $GITHUB_ENV
            keytool -list -keystore $RUNNER_TEMP/kr.keystore -storepass "$SP" -alias "$AL" > /dev/null && echo "Signing with alias $AL from the repository secrets." || echo "::error::Keystore secret present but alias '$AL' / password do not open it."

          else
            # No keystore secret: sign with a throw-away key. Set the ANDROID_KEYSTORE_* secrets
            # (docs/INSTALL.md) so releases share one private signature and update over each other.
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret missing — APKs signed with a one-off key; they will not install over an earlier release."
            keytool -genkeypair -v -keystore $RUNNER_TEMP/kr.keystore -alias kurokawa -keyalg RSA -keysize 2048 -validity 10000 -storepass kurokawa -keypass kurokawa -dname "CN=KurokawaReader, O=Kurokawa, C=SA"
            echo "KR_KEYSTORE_PASSWORD=kurokawa" >> $GITHUB_ENV
            echo "KR_KEY_ALIAS=kurokawa" >> $GITHUB_ENV
            echo "KR_KEY_PASSWORD=kurokawa" >> $GITHUB_ENV
          fi
          echo "KR_KEYSTORE=$RUNNER_TEMP/kr.keystore" >> $GITHUB_ENV
      - name: Build release APKs
        shell: bash
        run: |
          set -o pipefail
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon 2>&1 | tee $RUNNER_TEMP/android-build.log | grep -vE "^\s*$" | tail -n 400
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### Android job failed"; echo '```'; tail -n 120 $RUNNER_TEMP/android-prepare.log $RUNNER_TEMP/android-build.log 2>/dev/null | tail -c 60000; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null || true
      - name: Collect APKs
        run: |
          mkdir -p out
          V=${{ needs.version.outputs.v }}
          for f in android/app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            abi=$(echo "$base" | sed -E 's/app-(.*)-release.*\.apk/\1/')
            cp "$f" "out/KurokawaReader-$V-$abi.apk"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  ios:
    needs: version
    name: iOS IPA (unsigned, for AltStore / SideStore)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: Create iOS project
        shell: bash
        run: |
          set -o pipefail
          { npx cap add ios && node native/ios/overlay.mjs && npx cap sync ios; } 2>&1 | tee $RUNNER_TEMP/ios-prepare.log
      - name: Archive without signing
        shell: bash
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath $RUNNER_TEMP/App.xcarchive archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=app.kurokawa.reader 2>&1 | tee $RUNNER_TEMP/ios-build.log | grep -E "error|warning: .*fail|BUILD|ARCHIVE" || true
          test -d $RUNNER_TEMP/App.xcarchive/Products/Applications/App.app
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### iOS job failed"; echo '```'; tail -n 120 $RUNNER_TEMP/ios-prepare.log 2>/dev/null; grep -E "error:" $RUNNER_TEMP/ios-build.log 2>/dev/null | head -n 60; tail -n 40 $RUNNER_TEMP/ios-build.log 2>/dev/null; echo '```'; } | tail -c 60000 > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null || true
      - name: Package IPA
        run: |
          V=${{ needs.version.outputs.v }}
          mkdir -p Payload out
          cp -R $RUNNER_TEMP/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry "out/KurokawaReader-$V-ios-unsigned.ipa" Payload
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: out/*.ipa }

  windows:
    needs: version
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: Build installer and portable EXE
        shell: bash
        run: |
          cd desktop
          V=${{ needs.version.outputs.v }}
          npm version "$V" --no-git-tag-version --allow-same-version || true
          npm install
          npx electron-builder --win nsis portable --publish never 2>&1 | tee $RUNNER_TEMP/win-build.log | tail -n 200
          ls -la out
      - name: Report failure
        if: failure()
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### Windows job failed"; echo '```'; tail -n 120 $RUNNER_TEMP/win-build.log 2>/dev/null; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: desktop/out/*.exe }

  macos:
    needs: version
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: Build DMG (unsigned; universal)
        shell: bash
        run: |
          cd desktop
          V=${{ needs.version.outputs.v }}
          npm version "$V" --no-git-tag-version --allow-same-version || true
          npm install
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dmg --universal --publish never 2>&1 | tee $RUNNER_TEMP/mac-build.log | tail -n 60
          ls -la out
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### macOS job failed"; echo '```'; tail -n 120 $RUNNER_TEMP/mac-build.log 2>/dev/null; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: desktop/out/*.dmg }

  linux:
    needs: version
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: Build AppImage
        shell: bash
        run: |
          cd desktop
          V=${{ needs.version.outputs.v }}
          npm version "$V" --no-git-tag-version --allow-same-version || true
          npm install
          npx electron-builder --linux AppImage --x64 --publish never 2>&1 | tee $RUNNER_TEMP/linux-build.log | tail -n 60
          ls -la out
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### Linux job failed"; echo '```'; tail -n 120 $RUNNER_TEMP/linux-build.log 2>/dev/null; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: desktop/out/*.AppImage }

  release:
    name: Publish release
    needs: [version, web, android, ios, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Release notes
        run: |
          # What's new: commit subjects since the previous release, split into bullets.
          git fetch --tags --quiet || true
          PREV=$(git tag --sort=-v:refname | grep -v "^v${{ needs.version.outputs.v }}$" | head -n 1)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD~5..HEAD"; fi
          git log --format='%s' $RANGE | grep -v -i '^ci:\|^readme\|^release:\|^docs' | sed -E 's/^v?[0-9]+\.[0-9]+\.[0-9]+: //' | tr ';' '\n' | sed -E 's/^ +//; s/^(.)/- \u\1/' | grep -v '^- $' > whatsnew.txt || true
          {
            echo "## KurokawaReader v${{ needs.version.outputs.v }}"
            echo
            echo "## What's new"
            if [ -s whatsnew.txt ]; then cat whatsnew.txt; else echo "- Fixes and improvements"; fi
            echo
            echo "## Files"
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Android (most phones) | \`*-arm64-v8a.apk\` |"
            echo "| Android (older 32-bit phones) | \`*-armeabi-v7a.apk\` |"
            echo "| Android (emulators / x86 tablets) | \`*-x86_64.apk\` |"
            echo "| Android (any, larger) | \`*-universal.apk\` |"
            echo "| Windows | \`*-win-x64.exe\` installer, or the portable \`*.exe\` |"
            echo "| macOS | \`*-mac-universal.dmg\` (unsigned: right-click → Open the first time) |"
            echo "| Linux | \`*-linux-x64.AppImage\` (chmod +x, then run) |"
            echo "| iOS | \`*-ios-unsigned.ipa\` — install with AltStore / SideStore, see below |"
            echo "| Web (self-host) | \`KurokawaReader-web.zip\` |"
            echo
            cat docs/INSTALL.md
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.v }}
          name: KurokawaReader v${{ needs.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          make_latest: true
          files: |
            artifacts/web/*
            artifacts/android/*
            artifacts/ios/*
            artifacts/windows/*
            artifacts/macos/*
            artifacts/linux/*
