name: Tauri check (Reader)

# The Reader's Tauri shell (apps/reader/desktop-tauri, stages R0–R5 of docs/RUST-PORT-READER.md) and the crate it
# shares with Kurokawa Tools' (shared/shell-rs) built on Windows, Linux and macOS beside the Electron one, to see that
# it builds, how big its bundles are, and that it runs: the built app is started with KR_SELFTEST set, waits for the
# library to render and checks its own bridge — files, the whole-computer scan, web requests and charsets, the update
# check, window state, the clipboard, the stubs — against a loopback test server (desktop-tauri/selftest.js); and
# (R2) a file given on its command line reaches the page, a picked folder is walked by path, and a second launch
# with a file and a link hands them over and ends (single instance); (R3) cookies kept across requests and
# redirects, long redirect chains, the headers a page may not set, downloads with progress (whole, in parts,
# cancelled, deleted only in their folder), DNS over HTTPS through a resolver the test server plays, a notification
# asked for; (R4) the in-app browser on the test server's small site — passed out of sight, requests made by the
# site's own page with its cookies, the site's page refused the app's commands, a check window and a sign-in's end
# closing by themselves, a refusal, reset and forget, no window left; (R5) archives — a zip made, listed, tested,
# extracted (and in place), a hostile zip refused, a 7z with a password and a tar.gz through the 7-Zip shipped with
# the app —, a menu command reaching the page, full screen, zoom, taskbar progress, an image on the clipboard, the
# user's own app icon kept, put on the window and reset. (The build's log says which of Tauri's newer web-view and
# window functions it found: «KR build: …».) Then
# (R1) it is started again with KR_ENGINETEST set: the web app's key cases run in the system's own web view — books
# imported, kept over a reload, opened, searched, highlighted, a text book's place kept, PDFs drawn (one of 300
# pages), the PDF → Word converter, fonts and Arabic, read-aloud, full screen — with screenshots for a person to
# compare (desktop-tauri/enginetest.js) — since R5 also the Archives button opening and extracting an archive, and
# the title bar with a custom icon after a start —; its report and pictures are kept as artifacts. Linux and Windows must pass
# both; macOS is reported without failing the job for now. Modelled on tauri-check.yml (Tools'). The bundles are kept
# as workflow artifacts for 7 days; nothing is signed, published or released. Not run on main.
on:
  push:
    branches: ['work-reader-tauri*']
    paths:
      - 'apps/reader/desktop-tauri/**'
      - 'shared/shell-rs/**'
      - '.github/workflows/tauri-check-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04, bundles: 'appimage,deb', target: '' }
          - { name: Windows, os: windows-latest, bundles: 'nsis', target: '' }
          - { name: macOS, os: macos-latest, bundles: 'dmg', target: '' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # (The bridge against the Electron preload, the Rust command list and the self-test script: plain node. The
      # same test's page part — the built app in Chromium with a fake Tauri IPC — needs Playwright and runs locally.)
      - name: Web UI
        working-directory: apps/reader
        run: |
          for i in 1 2 3; do npm install && break; [ $i = 3 ] && exit 1; echo "npm install failed; again in 20 s"; sleep 20; done
          node scripts/build.mjs
          node tests/tauribridge.cjs --node-only
          node tests/tauriengine.cjs --node-only
          # (Left out of the computer apps, as the Electron build leaves it out: fetched from the web app when asked.)
          rm -f dist/samples/alice-in-wonderland.epub

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev file xvfb xauth at-spi2-core dbus-x11 imagemagick

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      # (The shared crate's and the Reader's std-only modules, tested alone: no crates needed.)
      - name: Std-only unit tests
        if: runner.os == 'Linux'
        run: |
          d="$RUNNER_TEMP/rs-tests"; mkdir -p "$d"
          for f in shared/shell-rs/src/util.rs shared/shell-rs/src/files.rs shared/shell-rs/src/testserver.rs shared/shell-rs/src/cookiejar.rs shared/shell-rs/src/doh.rs apps/reader/desktop-tauri/src-tauri/src/scan.rs apps/reader/desktop-tauri/src-tauri/src/openargs.rs apps/reader/desktop-tauri/src-tauri/src/dlplan.rs apps/reader/desktop-tauri/src-tauri/src/browserlogic.rs apps/reader/desktop-tauri/src-tauri/apidetect.rs apps/reader/desktop-tauri/src-tauri/src/archive.rs apps/reader/desktop-tauri/src-tauri/src/iconlogic.rs; do
            n=$(basename "$f" .rs)
            rustc --edition 2021 --test "$f" -o "$d/$n"
            "$d/$n"
          done

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/reader/desktop-tauri/src-tauri -> target'
          key: ${{ matrix.target }}

      # (Stage R5.) 7-Zip as the Electron build ships it: the npm package 7zip-bin of desktop/package.json's
      # dependencies (installed without its devDependencies — electron, electron-builder — and without install
      # scripts), this system's 7za copied into desktop-tauri/7zip/<plat>/<arch>/ (7zip-bin's own layout) with the
      # package's licence files; tauri.conf.json bundles that folder as resources/7zip/, and Tauri's build puts it
      # beside the bare program too (the self-tests run that). The archives that need 7-Zip are then the app's own.
      - name: 7-Zip for the bundle
        working-directory: apps/reader/desktop
        run: |
          for i in 1 2 3; do npm install --omit=dev --ignore-scripts --no-audit --no-fund && break; [ $i = 3 ] && exit 1; echo "npm install failed; again in 20 s"; sleep 20; done
          plat=$(node -p "({ win32: 'win', darwin: 'mac' })[process.platform] || 'linux'"); arch=$(node -p process.arch)
          src="node_modules/7zip-bin/$plat/$arch"
          echo "7zip-bin $(node -p "require('./node_modules/7zip-bin/package.json').version"), this system: $plat/$arch"
          if [ -d "$src" ]; then
            mkdir -p "../desktop-tauri/7zip/$plat/$arch"
            cp "$src"/7za* "../desktop-tauri/7zip/$plat/$arch/"
            chmod +x "../desktop-tauri/7zip/$plat/$arch/"7za* || true
          else
            echo "::warning::7zip-bin has no 7za for $plat/$arch — the archives that need 7-Zip will answer «7z missing»"
          fi
          find node_modules/7zip-bin -maxdepth 1 -type f \( -iname '*licen*' -o -iname 'copying*' \) -exec cp {} ../desktop-tauri/7zip/ \;
          find ../desktop-tauri/7zip -type f -exec ls -la {} \;

      - name: Icons (from desktop/icon.png)
        working-directory: apps/reader/desktop-tauri
        run: |
          npx --yes @tauri-apps/cli@^2 icon ../desktop/icon.png
          ls -la src-tauri/icons

      - name: Build
        working-directory: apps/reader/desktop-tauri
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
          else
            npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }}
          fi

      - name: Sizes
        working-directory: apps/reader/desktop-tauri/src-tauri
        run: |
          {
            echo "### ${{ matrix.name }} — Reader Tauri bundles"
            echo ""
            echo "| File | Size (MB) |"
            echo "|---|---:|"
            find target -path '*/release/bundle/*' -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) | sort | while read -r f; do
              b=$(wc -c < "$f" | tr -d ' ')
              echo "| \`$f\` | $(awk -v b="$b" 'BEGIN { printf "%.2f", b / 1048576 }') |"
            done
            find target -maxdepth 3 -path '*/release/*' -type f \( -name 'KurokawaReader' -o -name 'KurokawaReader.exe' \) | sort | while read -r f; do
              b=$(wc -c < "$f" | tr -d ' ')
              echo "| \`$f\` (bare executable) | $(awk -v b="$b" 'BEGIN { printf "%.2f", b / 1048576 }') |"
            done
            echo ""
            echo "Electron today: Windows installer 81.6 MB, portable 81.5 MB, macOS 166 MB, Linux AppImage 82.5 MB."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-reader-${{ matrix.os }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            apps/reader/desktop-tauri/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/reader/desktop-tauri/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/reader/desktop-tauri/src-tauri/target/**/release/bundle/deb/*.deb
            apps/reader/desktop-tauri/src-tauri/target/**/release/bundle/dmg/*.dmg

      # The runtime self-test: the built app started with KR_SELFTEST=<file>; it writes its results there and exits
      # 0 (all required checks passed), 1 (one failed) or 2 (its own watchdog, KR_SELFTEST_TIMEOUT seconds). (Longer
      # than Tools': the whole-computer scan walks up to 20000 folders; since R4 the in-app browser's checks.)
      - name: Self-test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        working-directory: apps/reader/desktop-tauri/src-tauri
        env:
          KR_SELFTEST_TIMEOUT: '330'
          # (Xvfb without a window manager: the title bar's maximise is not tried — the row says «skipped».)
          KR_SELFTEST_NO_WM: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          NO_AT_BRIDGE: '1'
        run: |
          out="$RUNNER_TEMP/kr-selftest.json"
          # (R2: a file given on the command line, as «Open with» gives one — the page must receive it; the second
          # launch the self-test makes needs a D-Bus session bus for the single-instance plugin: dbus-run-session.)
          d="$RUNNER_TEMP/kr-open"; mkdir -p "$d"; f="$d/kr open-first.txt"; printf 'Opened at start, from the command line.\n' > "$f"
          bus=""; command -v dbus-run-session >/dev/null && bus="dbus-run-session --"
          echo "D-Bus: ${bus:-none}"
          set +e
          find target/release/7zip -type f -exec ls -la {} \; || echo "no 7zip/ beside the executable"
          KR_SELFTEST="$out" KR_SELFTEST_OPEN="$f" timeout 400 $bus xvfb-run -a -s '-screen 0 1280x900x24' ./target/release/KurokawaReader "$f"
          code=$?
          set -e
          node ../selftest-report.cjs "$out" "$code" "${{ matrix.name }}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/reader/desktop-tauri/src-tauri
        env:
          KR_SELFTEST_TIMEOUT: '330'
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'kr-selftest.json'
          $env:KR_SELFTEST = $out
          # (R2: a file given on the command line, as a double-click or «Open with» gives one — on D:, another drive.)
          $d = Join-Path $env:RUNNER_TEMP 'kr-open'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          $f = Join-Path $d 'kr open-first.txt'
          [System.IO.File]::WriteAllText($f, "Opened at start, from the command line.`n")
          $env:KR_SELFTEST_OPEN = $f
          if (Test-Path 'target/release/7zip') { Get-ChildItem 'target/release/7zip' -Recurse -File | Format-Table FullName, Length } else { 'no 7zip/ beside the executable' }
          $exe = (Resolve-Path 'target/release/KurokawaReader.exe').Path
          $p = Start-Process -FilePath $exe -ArgumentList ('"' + $f + '"') -PassThru
          $null = $p.Handle
          if ($p.WaitForExit(400000)) { $code = $p.ExitCode } else { Stop-Process -Id $p.Id -Force; $code = 124 }
          node ../selftest-report.cjs $out $code '${{ matrix.name }}' | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $code

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: apps/reader/desktop-tauri/src-tauri
        env:
          KR_SELFTEST_TIMEOUT: '330'
        run: |
          out="$RUNNER_TEMP/kr-selftest.json"
          # (The bare executable, as on Linux: the web UI is built into it.)
          if [ -n "${{ matrix.target }}" ]; then bin="target/${{ matrix.target }}/release/KurokawaReader"; else bin="target/release/KurokawaReader"; fi
          [ -x "$bin" ] || { echo "no executable at $bin"; exit 1; }
          echo "running $bin"
          # (R2: a file given on the command line — the page must receive it.)
          d="$RUNNER_TEMP/kr-open"; mkdir -p "$d"; f="$d/kr open-first.txt"; printf 'Opened at start, from the command line.\n' > "$f"
          set +e
          find target/release/7zip -type f -exec ls -la {} \; || echo "no 7zip/ beside the executable"
          # (No `timeout` on macOS: perl's alarm ends it after 400 s.)
          KR_SELFTEST="$out" KR_SELFTEST_OPEN="$f" perl -e 'alarm 400; exec @ARGV' "$bin" "$f"
          code=$?
          set -e
          node ../selftest-report.cjs "$out" "$code" "${{ matrix.name }}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      # The engine test (stage R1): the built app started with KR_ENGINETEST=<file>; the web app's key cases run in
      # this system's web view, screenshots are taken with the system's tool (KR_ENGINETEST_SHOTS), and it exits 0
      # (every required check passed), 1 (one failed) or 2 (the watchdog, KR_ENGINETEST_TIMEOUT seconds). It runs
      # even when the self-test failed, to learn as much as one run can. KR_ENGINETEST_BUDGET: the seconds after
      # which the cases not yet run are written as skipped.
      - name: Engine test (Linux, under Xvfb)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        working-directory: apps/reader/desktop-tauri/src-tauri
        env:
          KR_ENGINETEST_TIMEOUT: '560'
          KR_ENGINETEST_BUDGET: '500'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          NO_AT_BRIDGE: '1'
        run: |
          d="$RUNNER_TEMP/kr-engine"; mkdir -p "$d"
          { echo "WebKitGTK $(pkg-config --modversion webkit2gtk-4.1 2>/dev/null)"; echo "$(lsb_release -ds 2>/dev/null)"; echo "ImageMagick: $(command -v import || echo none)"; } | tee "$d/versions.txt"
          set +e
          KR_ENGINETEST="$d/report.json" KR_ENGINETEST_SHOTS="$d" timeout 640 xvfb-run -a -s '-screen 0 1280x900x24' ./target/release/KurokawaReader
          code=$?
          set -e
          { node ../enginetest-report.cjs "$d/report.json" "$code" "${{ matrix.name }}" "$d/report.md"; echo "Versions: $(tr '\n' ' ' < "$d/versions.txt")"; echo; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Engine test (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        working-directory: apps/reader/desktop-tauri/src-tauri
        env:
          KR_ENGINETEST_TIMEOUT: '560'
          KR_ENGINETEST_BUDGET: '500'
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'kr-engine'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          $wv = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv
          "WebView2 Runtime $wv; $((Get-CimInstance Win32_OperatingSystem).Caption)" | Tee-Object -FilePath (Join-Path $d 'versions.txt')
          $env:KR_ENGINETEST = Join-Path $d 'report.json'
          $env:KR_ENGINETEST_SHOTS = $d
          $exe = (Resolve-Path 'target/release/KurokawaReader.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          $null = $p.Handle
          if ($p.WaitForExit(640000)) { $code = $p.ExitCode } else { Stop-Process -Id $p.Id -Force; $code = 124 }
          node ../enginetest-report.cjs (Join-Path $d 'report.json') $code '${{ matrix.name }}' (Join-Path $d 'report.md') | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Versions: $(Get-Content (Join-Path $d 'versions.txt'))`n" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $code

      - name: Engine test (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        continue-on-error: true
        working-directory: apps/reader/desktop-tauri/src-tauri
        env:
          KR_ENGINETEST_TIMEOUT: '560'
          KR_ENGINETEST_BUDGET: '500'
        run: |
          d="$RUNNER_TEMP/kr-engine"; mkdir -p "$d"
          { echo "macOS $(sw_vers -productVersion)"; echo "Safari $(defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString 2>/dev/null)"; } | tee "$d/versions.txt"
          if [ -n "${{ matrix.target }}" ]; then bin="target/${{ matrix.target }}/release/KurokawaReader"; else bin="target/release/KurokawaReader"; fi
          [ -x "$bin" ] || { echo "no executable at $bin"; exit 1; }
          set +e
          KR_ENGINETEST="$d/report.json" KR_ENGINETEST_SHOTS="$d" perl -e 'alarm 640; exec @ARGV' "$bin"
          code=$?
          set -e
          { node ../enginetest-report.cjs "$d/report.json" "$code" "${{ matrix.name }}" "$d/report.md"; echo "Versions: $(tr '\n' ' ' < "$d/versions.txt")"; echo; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      # The engine test's report (Markdown and JSON), versions and screenshots, for a person to look at.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tauri-reader-engine-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/kr-engine/
