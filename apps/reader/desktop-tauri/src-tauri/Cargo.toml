[package]
# (The program's name is the product's: a Mac shows it in the menu bar and keys the web view's data by it when run
# outside its bundle; Windows and Linux show it in the task manager.)
name = "KurokawaReader"
# (Not the app's version: Tauri takes that from tauri.conf.json, which reads apps/reader/package.json.)
version = "0.0.0"
description = "KurokawaReader — the Tauri shell"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The versions of Kurokawa Tools' Tauri shell (branch work-tauri), where they compiled on all three systems.
# kurokawa-shell (shared/shell-rs) uses the same, so one version of each is resolved.
[dependencies]
kurokawa-shell = { path = "../../../../shared/shell-rs" }
# (Stage R5: "image-png" — Image::from_bytes, a PNG read for the window's icon and the clipboard's image.)
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
# (Stage R2: a second launch hands its files to the running window — the official plugin, as its documentation adds it.)
tauri-plugin-single-instance = "2"
# (Stage R3: system notifications — the official plugin, as its documentation adds it; used from Rust only.)
tauri-plugin-notification = "2"
serde_json = "1"
# (Stage R5: raw deflate for the archives' own ZIP reader and writer — archive.rs, archives.rs. Pure Rust
# (miniz_oxide); already in the build through reqwest's gzip.)
flate2 = "1"

# (Stage R5: the free space of a disk — statvfs; already in the build through Tauri.)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
