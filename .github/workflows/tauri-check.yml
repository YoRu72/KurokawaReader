name: Tauri check

# The Tauri shell of Kurokawa Tools (apps/tools/desktop-tauri, stages P1–P3) built on Windows, Linux and macOS beside
# the Electron one, to see that it builds, how big its bundles are, and that it runs: the built app is started with
# KT_SELFTEST set and checks its own bridge, files, http, the recycle bin, free space, fonts, MEGA, the Files page's
# copy / move / delete jobs (on temp folders, across disks where the machine has two) and the download engine against
# a loopback test server, and (stage P7) the archives with the 7-Zip the app ships (desktop-tauri/selftest.js). Linux
# and Windows must pass; macOS is reported without failing
# the job for now. Since P3 the shell is built on the shared crate (shared/shell-rs, the Reader's too) and Tools' own
# kt-core (apps/tools/core/kt-core), so a change to either runs this. Since P6–P8 also the app icon of the user's
# choosing, DNS over HTTPS and the updater's download and checks (against the test server). Nothing is signed or
# released: no workflow publishes this shell's builds yet (stage P9).
on:
  push:
    branches: ['work-tauri*']
    paths:
      - 'apps/tools/desktop-tauri/**'
      - 'apps/tools/core/**'
      - 'shared/shell-rs/**'
      - 'apps/tools/src/**'
      - '.github/workflows/tauri-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04, bundles: 'appimage,deb', target: '' }
          - { name: Windows, os: windows-latest, bundles: 'nsis', target: '' }
          - { name: macOS, os: macos-latest, bundles: 'dmg', target: '' }
          - { name: macOS universal, os: macos-latest, bundles: 'dmg', target: 'universal-apple-darwin' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Web UI
        working-directory: apps/tools
        run: |
          for i in 1 2 3; do npm install && break; [ $i = 3 ] && exit 1; echo "npm install failed; again in 20 s"; sleep 20; done
          node scripts/build.mjs
          node tests/tauribridge.cjs

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev file xvfb xauth at-spi2-core dbus-x11

      # (Screen translator: Tesseract with its English data — what a Linux user installs for the screen translator's
      # OCR —, so the self-test's OCR row reads the text it draws; not needed to build.)
      - name: Tesseract for the screen translator's OCR row
        if: runner.os == 'Linux'
        run: sudo apt-get install -y tesseract-ocr tesseract-ocr-eng || echo "no Tesseract — the OCR row is then reported, not required"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      # The std-only modules' own tests, with rustc alone (the same ones run in the workspace): kt-core, the shell's
      # recycle bin and API detection, and the shared crate's std-only parts. On Linux (/dev/shm is a second disk
      # there, so the file jobs' moves across disks are tested too).
      - name: Std-only unit tests
        if: runner.os == 'Linux'
        run: |
          d="$RUNNER_TEMP/rs-tests"; mkdir -p "$d"
          for f in apps/tools/core/kt-core/src/engine_core.rs apps/tools/core/kt-core/src/filejobs.rs apps/tools/core/kt-core/src/fontnames.rs apps/tools/core/kt-core/src/mega.rs apps/tools/core/kt-core/src/places.rs apps/tools/core/kt-core/src/updatelogic.rs apps/tools/core/kt-core/src/dohnames.rs apps/tools/core/kt-core/src/streamlogic.rs apps/tools/desktop-tauri/src-tauri/src/torrentmake.rs apps/tools/desktop-tauri/src-tauri/src/rpc.rs apps/tools/desktop-tauri/src-tauri/src/trash.rs apps/tools/desktop-tauri/src-tauri/apidetect.rs shared/shell-rs/src/util.rs shared/shell-rs/src/files.rs shared/shell-rs/src/testserver.rs shared/shell-rs/src/cookiejar.rs shared/shell-rs/src/doh.rs shared/shell-rs/src/archive.rs shared/shell-rs/src/iconlogic.rs; do
            n=$(basename "$f" .rs)
            rustc --edition 2021 --test "$f" -o "$d/$n"
            "$d/$n"
          done

      # (Stages P6–P8: the desktop integration's, the in-app browser's and the local servers' std-only rules.)
      - name: Std-only unit tests (P6-P8)
        if: runner.os == 'Linux'
        run: |
          d="$RUNNER_TEMP/rs-tests-p6"; mkdir -p "$d"
          for f in apps/tools/desktop-tauri/src-tauri/src/desklogic.rs apps/tools/desktop-tauri/src-tauri/src/lanlogic.rs shared/shell-rs/src/browserlogic.rs; do
            n=$(basename "$f" .rs)
            rustc --edition 2021 --test "$f" -o "$d/$n"
            "$d/$n"
          done

      # (Stage P5: the video tools' std-only parts — kt-core's rules and JSON, the self-test's stand-in programs and
      # their loopback server, the process runner with its tree kill — on every system, since running and killing
      # programs differ between them.)
      - name: Std-only unit tests (stage P5, video tools)
        shell: bash
        run: |
          d="$RUNNER_TEMP/rs-tests-p5"; mkdir -p "$d"
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          for f in apps/tools/core/kt-core/src/videotools.rs apps/tools/core/kt-core/src/vidjson.rs apps/tools/desktop-tauri/src-tauri/src/vtfake.rs apps/tools/desktop-tauri/src-tauri/src/vtproc.rs; do
            n=$(basename "$f" .rs)
            rustc --edition 2021 --test "$f" -o "$d/$n$ext"
            "$d/$n$ext"
          done

      # (Screen translator: its std-only rules — kt-core's screenlogic.rs: monitors and regions, the OCR answers, pixels
      # and the PNG, the portal's answers — on every system.)
      - name: Std-only unit tests (screen translator)
        shell: bash
        run: |
          d="$RUNNER_TEMP/rs-tests-scr"; mkdir -p "$d"
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          rustc --edition 2021 --test apps/tools/core/kt-core/src/screenlogic.rs -o "$d/screenlogic$ext"
          "$d/screenlogic$ext"

      # (Stage P9: the switch-over's own checks. Plain node: the installer's one screen put into Tauri's script and the
      # hooks' keep/replace rule, the release files' names alike everywhere (the Electron switch's too), the hand-over's
      # and the setup program's copies the same as the Reader's apart from the names. Std only: the hand-over's rules,
      # the setup program's decisions.)
      - name: Switch-over checks (stage P9)
        shell: bash
        run: |
          # (The node checks on Linux only: a Windows checkout turns line ends into CRLF, which the copies' compare and the
          # installer's script checks are not written for — the same lesson as grab.js in run 43543617161.)
          if [ "$RUNNER_OS" = Linux ]; then (cd apps/tools && node tests/installerpatch.cjs && node tests/updatenames.cjs && node tests/shared-copies.cjs); fi
          d="$RUNNER_TEMP/rs-tests-p9"; mkdir -p "$d"
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          for f in apps/tools/core/kt-core/src/handoverlogic.rs apps/tools/core/kt-core/src/ownerlogic.rs apps/tools/desktop-tauri/setup/src-tauri/src/logic.rs; do
            n=$(basename "$(dirname "$(dirname "$f")")")-$(basename "$f" .rs)
            rustc --edition 2021 --test "$f" -o "$d/$n$ext"
            "$d/$n$ext"
          done

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/tools/desktop-tauri/src-tauri -> target'
          key: ${{ matrix.target }}

      # aria2c as the Electron build gets it (desktop/fetch-aria2.mjs → desktop/aria2/<plat>-<arch>/; none for macOS),
      # copied into desktop-tauri/aria2/, which tauri.conf.json bundles as resources/aria2/.
      - name: aria2c for the bundle
        working-directory: apps/tools/desktop
        run: |
          node fetch-aria2.mjs
          mkdir -p aria2 ../desktop-tauri/aria2
          for d in aria2/*/; do [ -d "$d" ] && cp -R "${d%/}" ../desktop-tauri/aria2/; done
          find ../desktop-tauri/aria2 -type f -exec ls -la {} \;

      # (Stage P7.) 7-Zip as the Electron build ships it: the npm package 7zip-bin at the version desktop/package.json
      # names, installed alone (no install scripts) into a folder of the runner's, this system's 7za copied into
      # desktop-tauri/7zip/<plat>/<arch>/ (7zip-bin's own layout) with the package's licence files; tauri.conf.json
      # bundles that folder as resources/7zip/, and Tauri's build puts it beside the bare program too (the self-test
      # runs that). The Reader's workflow does the same from its desktop project.
      - name: 7-Zip for the bundle
        working-directory: apps/tools/desktop
        run: |
          v=$(node -p "require('./package.json').dependencies['7zip-bin']")
          # (A relative folder of the checkout — apps/tools/.ci-7zip-bin, never committed —: the same spelling for bash and
          # node on every runner, Windows' too.)
          d="../.ci-7zip-bin"; mkdir -p "$d"
          for i in 1 2 3; do npm install --prefix "$d" --ignore-scripts --no-audit --no-fund --no-save "7zip-bin@$v" && break; [ $i = 3 ] && exit 1; echo "npm install failed; again in 20 s"; sleep 20; done
          pkg="$d/node_modules/7zip-bin"
          plat=$(node -p "({ win32: 'win', darwin: 'mac' })[process.platform] || 'linux'"); arch=$(node -p process.arch)
          echo "7zip-bin $(node -p "require(require('path').resolve(process.argv[1], 'package.json')).version" "$pkg"), this system: $plat/$arch"
          if [ -d "$pkg/$plat/$arch" ]; then
            mkdir -p "../desktop-tauri/7zip/$plat/$arch"
            cp "$pkg/$plat/$arch"/7za* "../desktop-tauri/7zip/$plat/$arch/"
            chmod +x "../desktop-tauri/7zip/$plat/$arch/"7za* || true
          else
            echo "::warning::7zip-bin has no 7za for $plat/$arch — the archives that need 7-Zip will answer «7z missing»"
          fi
          find "$pkg" -maxdepth 1 -type f \( -iname '*licen*' -o -iname 'copying*' \) -exec cp {} ../desktop-tauri/7zip/ \;
          find ../desktop-tauri/7zip -type f -exec ls -la {} \;

      - name: Icons (from desktop/icon.png)
        working-directory: apps/tools/desktop-tauri
        run: |
          npx --yes @tauri-apps/cli@^2 icon ../desktop/icon.png
          ls -la src-tauri/icons

      - name: Build
        id: build
        working-directory: apps/tools/desktop-tauri
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
          else
            npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }}
          fi

      # (Stage P9, Windows: the installer's one screen, the designed setup program over it, the portable zip — as the
      # Reader's tauri-check-reader.yml makes them, with Tools' names. The setup program is told the program's file name
      # Tauri gave it (its rendered installer script's MAINBINARYNAME). A failed setup build lets the steps after it run;
      # «Setup program, end to end» then fails on finding none.)
      - name: One-page installer (stage P9)
        if: runner.os == 'Windows'
        working-directory: apps/tools/desktop-tauri
        run: node src-tauri/installer/onepage.cjs src-tauri --strict

      - name: Setup program (stage P9)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        working-directory: apps/tools/desktop-tauri/src-tauri
        run: |
          $inner = Get-ChildItem 'target/release/bundle/nsis/*-setup.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $inner) { throw 'no NSIS installer to embed' }
          $v = (node -p "require('../../package.json').version").Trim()
          $nsi = Get-ChildItem 'target' -Recurse -Depth 4 -Filter 'installer.nsi' -ErrorAction SilentlyContinue | Select-Object -First 1
          $main = if ($nsi) { (Select-String -Path $nsi.FullName -Pattern '^\s*!define\s+MAINBINARYNAME\s+"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value } else { '' }
          $appExe = if ($main) { "$main.exe" } else { 'Kurokawa Tools.exe' }
          "KT_APP_EXE=$appExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:KR_SETUP_INNER = $inner.FullName
          $env:KR_SETUP_APP_EXE = $appExe
          $env:KR_SETUP_APP_BYTES = "$((Get-Item 'target/release/kurokawa-tools.exe').Length)"
          $env:CARGO_TARGET_DIR = (Resolve-Path 'target').Path
          $t = Measure-Command { cargo build --release --manifest-path ../setup/src-tauri/Cargo.toml 2>&1 | Write-Host }
          if ($LASTEXITCODE) { throw "setup program: cargo build failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force -Path 'target/release/bundle/setup' | Out-Null
          $out = "target/release/bundle/setup/KurokawaTools-$v-windows-x64.exe"
          Copy-Item 'target/release/KurokawaToolsSetup.exe' $out -Force
          "Setup program: $out, $('{0:N2}' -f ((Get-Item $out).Length / 1MB)) MB (embedded installer $('{0:N2}' -f ($inner.Length / 1MB)) MB; the app's program: $appExe), built in $('{0:N0}' -f $t.TotalSeconds) s" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Portable zip (stage P9)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/tools/desktop-tauri/src-tauri
        run: |
          $v = (node -p "require('../../package.json').version").Trim()
          $s = Join-Path $env:RUNNER_TEMP 'kt-portable'; New-Item -ItemType Directory -Force -Path $s | Out-Null
          Copy-Item 'target/release/kurokawa-tools.exe' (Join-Path $s 'Kurokawa Tools.exe')
          foreach ($r in 'aria2', '7zip') { if (Test-Path "target/release/$r") { Copy-Item "target/release/$r" (Join-Path $s $r) -Recurse } }
          Set-Content (Join-Path $s 'KurokawaTools.portable') 'This copy is portable: it never updates itself. Download the new portable zip from the release page.'
          New-Item -ItemType Directory -Force -Path 'target/release/bundle/portable' | Out-Null
          $z = "target/release/bundle/portable/KurokawaTools-$v-windows-x64-portable.zip"
          Compress-Archive -Path (Join-Path $s '*') -DestinationPath $z -CompressionLevel Optimal -Force
          "Portable zip: $z, $('{0:N2}' -f ((Get-Item $z).Length / 1MB)) MB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Sizes
        working-directory: apps/tools/desktop-tauri/src-tauri
        run: |
          {
            echo "### ${{ matrix.name }} — Tauri bundles"
            echo ""
            echo "| File | Size (MB) |"
            echo "|---|---:|"
            find target -path '*/release/bundle/*' -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) | sort | while read -r f; do
              b=$(wc -c < "$f" | tr -d ' ')
              echo "| \`$f\` | $(awk -v b="$b" 'BEGIN { printf "%.2f", b / 1048576 }') |"
            done
            find target -maxdepth 3 -path '*/release/*' -type f \( -name 'kurokawa-tools' -o -name 'kurokawa-tools.exe' \) | sort | while read -r f; do
              b=$(wc -c < "$f" | tr -d ' ')
              echo "| \`$f\` (bare executable) | $(awk -v b="$b" 'BEGIN { printf "%.2f", b / 1048576 }') |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            apps/tools/desktop-tauri/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/tools/desktop-tauri/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/tools/desktop-tauri/src-tauri/target/**/release/bundle/deb/*.deb
            apps/tools/desktop-tauri/src-tauri/target/**/release/bundle/dmg/*.dmg

      # The runtime self-test: the built app started with KT_SELFTEST=<file>; it writes its results there and exits
      # 0 (all required checks passed), 1 (one failed) or 2 (its own watchdog, KT_SELFTEST_TIMEOUT seconds).
      - name: Self-test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        working-directory: apps/tools/desktop-tauri/src-tauri
        env:
          KT_SELFTEST_TIMEOUT: '290'
          KT_SELFTEST_BUNDLED: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          NO_AT_BRIDGE: '1'
        run: |
          find target/release/aria2 -type f -exec ls -la {} \; || echo "no aria2/ beside the executable"
          find target/release/7zip -type f -exec ls -la {} \; || echo "no 7zip/ beside the executable"
          # (Two launches since P5 merged — KT_SELFTEST_PART 1 and 2, selftest.js says which checks each runs —, each
          # under its own watchdog; the step fails with the first failing launch's code, after both have run.)
          # (A session bus of its own, so the single-instance hand-over has one for certain: in run 43543617161 the
          # second launch did not end. The self-test row now also prints what that launch said.)
          bus=""; if command -v dbus-run-session >/dev/null; then bus="dbus-run-session --"; fi
          code=0
          for part in 1 2; do
            out="$RUNNER_TEMP/kt-selftest-$part.json"
            set +e
            KT_SELFTEST="$out" KT_SELFTEST_PART="$part" $bus timeout 340 xvfb-run -a -s '-screen 0 1280x900x24' ./target/release/kurokawa-tools
            c=$?
            set -e
            node ../selftest-report.cjs "$out" "$c" "${{ matrix.name }} (part $part of 2)" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$c" != 0 ] && [ "$code" = 0 ]; then code=$c; fi
          done
          exit $code

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/tools/desktop-tauri/src-tauri
        env:
          KT_SELFTEST_TIMEOUT: '290'
          KT_SELFTEST_BUNDLED: '1'
        run: |
          if (Test-Path 'target/release/aria2') { Get-ChildItem 'target/release/aria2' -Recurse -File | Format-Table FullName, Length } else { 'no aria2/ beside the executable' }
          $exe = (Resolve-Path 'target/release/kurokawa-tools.exe').Path
          # (Two launches, KT_SELFTEST_PART 1 and 2, each under its own watchdog — as on Linux.)
          $code = 0
          foreach ($part in 1, 2) {
            $out = Join-Path $env:RUNNER_TEMP "kt-selftest-$part.json"
            $env:KT_SELFTEST = $out
            $env:KT_SELFTEST_PART = "$part"
            $p = Start-Process -FilePath $exe -PassThru
            $null = $p.Handle
            if ($p.WaitForExit(340000)) { $c = $p.ExitCode } else { Stop-Process -Id $p.Id -Force; $c = 124 }
            node ../selftest-report.cjs $out $c "${{ matrix.name }} (part $part of 2)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            if ($c -ne 0 -and $code -eq 0) { $code = $c }
          }
          exit $code

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: apps/tools/desktop-tauri/src-tauri
        env:
          KT_SELFTEST_TIMEOUT: '290'
        run: |
          # (The bare executable, as on Linux: the web UI is built into it; macOS bundles no aria2c.)
          if [ -n "${{ matrix.target }}" ]; then bin="target/${{ matrix.target }}/release/kurokawa-tools"; else bin="target/release/kurokawa-tools"; fi
          [ -x "$bin" ] || { echo "no executable at $bin"; exit 1; }
          echo "running $bin"
          # (Two launches, KT_SELFTEST_PART 1 and 2, each under its own watchdog — as on Linux.)
          code=0
          for part in 1 2; do
            out="$RUNNER_TEMP/kt-selftest-$part.json"
            set +e
            # (No `timeout` on macOS: perl's alarm ends it after 340 s.)
            KT_SELFTEST="$out" KT_SELFTEST_PART="$part" perl -e 'alarm 340; exec @ARGV' "$bin"
            c=$?
            set -e
            node ../selftest-report.cjs "$out" "$c" "${{ matrix.name }} (part $part of 2)" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$c" != 0 ] && [ "$code" = 0 ]; then code=$c; fi
          done
          exit $code

      # (Stage P9, Windows required.) The installer end to end (desktop-tauri/installtest.ps1: an Electron Tools made to
      # look installed — kept beside the new program with its links and .torrent while its data is not handed over,
      # replaced once a hand-over's marker is there —, the installed app's self-test, an update over it as the updater
      # runs it, a silent uninstall that keeps the data), then the designed setup program end to end
      # (desktop-tauri/setup/setuptest.ps1), then the hand-over for real: the ELECTRON Tools (`electron .`, driven by
      # Playwright: tests/handover-electron.cjs) given settings, lists, add-ons, history, an icon, a screen font and —
      # with its own aria2c — a download moving and one paused, from a loopback server; its hand-over made as the bridge
      # build makes it; then the Tauri build started with an EMPTY web-view profile and KTH_SELFTEST set: the engine's
      # files there before aria2c starts (the moving download going, the paused one paused), the offer, «Bring it
      # now», and after the reload every key, record and kept file the same (desktop-tauri/handovercheck.js). Linux is
      # reported.
      - name: Installer, end to end (Windows, stage P9)
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build.outcome == 'success' }}
        shell: pwsh
        working-directory: apps/tools/desktop-tauri/src-tauri
        run: ../installtest.ps1

      - name: Setup program, end to end (Windows, stage P9)
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build.outcome == 'success' }}
        shell: pwsh
        working-directory: apps/tools/desktop-tauri/src-tauri
        run: ../setup/setuptest.ps1

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        with:
          name: tauri-tools-install-windows
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/kr-install/*.png
            ${{ runner.temp }}/kr-install/*.json
            ${{ runner.temp }}/kr-install/*.md
            ${{ runner.temp }}/kr-install/*.log
            ${{ runner.temp }}/kr-install/nsis-*/*.nsi

      - name: Hand-over — Electron makes it (Windows, stage P9)
        timeout-minutes: 15
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          # (The Tauri build's web-view profile and hand-over state emptied: the self-tests above filled them, and a
          # user's first start of the Rust build has neither. WebView2's helpers may hold the profile a moment.)
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          foreach ($w in (Join-Path $env:LOCALAPPDATA 'app.kurokawa.tools'), (Join-Path $env:APPDATA 'app.kurokawa.tools')) {
            for ($i = 0; $i -lt 10 -and (Test-Path $w); $i++) { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $w; if (Test-Path $w) { Start-Sleep -Seconds 3 } }
            if (Test-Path $w) { "the Tauri build's data could not be emptied: $w"; exit 1 }
          }
          Set-Location apps/tools
          if (-not (Test-Path 'desktop/dist')) { Copy-Item 'dist' 'desktop/dist' -Recurse }
          Set-Location desktop
          for ($i = 1; $i -le 3; $i++) { npm install --no-audit --no-fund; if ($LASTEXITCODE -eq 0) { break }; if ($i -eq 3) { exit 1 }; Start-Sleep -Seconds 20 }
          Set-Location ..
          for ($i = 1; $i -le 3; $i++) { npm install --no-save --no-audit --no-fund playwright-core@1.48.2; if ($LASTEXITCODE -eq 0) { break }; if ($i -eq 3) { exit 1 }; Start-Sleep -Seconds 20 }
          node tests/handover-electron.cjs (Join-Path $env:RUNNER_TEMP 'kt-handover-expect.json') (Join-Path $env:RUNNER_TEMP 'kt-handover-work')
          exit $LASTEXITCODE

      - name: Hand-over — the Tauri build brings it (Windows, stage P9)
        timeout-minutes: 15
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build.outcome == 'success' }}
        shell: pwsh
        working-directory: apps/tools/desktop-tauri/src-tauri
        env:
          KTH_SELFTEST_TIMEOUT: '400'
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'kt-handover-check.json'
          $env:KTH_SELFTEST = $out
          $env:KTH_EXPECT = Join-Path $env:RUNNER_TEMP 'kt-handover-expect.json'
          if (-not (Test-Path $env:KTH_EXPECT)) { 'no expectation: the Electron step did not finish'; exit 1 }
          $exe = (Resolve-Path 'target/release/kurokawa-tools.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          $null = $p.Handle
          if ($p.WaitForExit(460000)) { $code = $p.ExitCode } else { Stop-Process -Id $p.Id -Force; $code = 124 }
          node ../selftest-report.cjs $out $code 'Windows — hand-over (Electron → Tauri)' | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $code

      - name: Hand-over — Electron → Tauri (Linux, under Xvfb; reported, stage P9)
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          KTH_SELFTEST_TIMEOUT: '400'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          NO_AT_BRIDGE: '1'
        run: |
          rm -rf "$HOME/.local/share/app.kurokawa.tools" "$HOME/.cache/app.kurokawa.tools"
          (cd apps/tools && [ -d desktop/dist ] || cp -R dist desktop/dist)
          (cd apps/tools/desktop && for i in 1 2 3; do npm install --no-audit --no-fund && break; [ $i = 3 ] && exit 1; sleep 20; done)
          (cd apps/tools && for i in 1 2 3; do npm install --no-save --no-audit --no-fund playwright-core@1.48.2 && break; [ $i = 3 ] && exit 1; sleep 20; done)
          xvfb-run -a -s '-screen 0 1280x900x24' node apps/tools/tests/handover-electron.cjs "$RUNNER_TEMP/kt-handover-expect.json" "$RUNNER_TEMP/kt-handover-work"
          cd apps/tools/desktop-tauri/src-tauri
          bus=""; if command -v dbus-run-session >/dev/null; then bus="dbus-run-session --"; fi
          set +e
          KTH_SELFTEST="$RUNNER_TEMP/kt-handover-check.json" KTH_EXPECT="$RUNNER_TEMP/kt-handover-expect.json" $bus timeout 460 xvfb-run -a -s '-screen 0 1280x900x24' ./target/release/kurokawa-tools
          code=$?
          set -e
          node ../selftest-report.cjs "$RUNNER_TEMP/kt-handover-check.json" "$code" "Linux — hand-over (Electron → Tauri)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      # (Stage P9.) The setup program's page and the first run / the hand-over's pages in Chromium (tests/setupui.cjs:
      # every state in English and Arabic, light and dark; tests/handover.cjs, tests/firstrun.cjs). Linux only.
      - name: Switch-over pages (Linux, Chromium, stage P9)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        working-directory: apps/tools
        run: |
          for i in 1 2 3; do npm install --no-save --no-audit --no-fund playwright@1.48.2 && break; [ $i = 3 ] && exit 1; sleep 20; done
          npx playwright install --with-deps chromium
          node tests/setupui.cjs
          node tests/handover.cjs
          node tests/firstrun.cjs
          # (After the switch-over: one program runs the shared downloads — the owner rule's table, races and page.)
          node tests/ownerlock.cjs
          node tests/videotauri.cjs

      # (Stage P4.) librqbit, which the main build leaves out (src-tauri/Cargo.toml's [features] says why): turned on in
      # this runner's copy only, `cargo check --features rqbit`, the compiler's errors printed — never required, and
      # last, so nothing after it builds with it. Its errors say which guesses of src/stream_rqbit.rs were wrong.
      - name: librqbit try (not required)
        if: always() && runner.os == 'Linux' && steps.build.outcome != 'skipped'
        continue-on-error: true
        working-directory: apps/tools/desktop-tauri/src-tauri
        run: |
          cp Cargo.toml "$RUNNER_TEMP/Cargo.toml.main"
          sed -i 's/^rqbit = \[\]$/rqbit = ["dep:librqbit", "dep:tokio"]/' Cargo.toml
          printf '\n[dependencies.librqbit]\nversion = "8"\noptional = true\n\n[dependencies.tokio]\nversion = "1"\noptional = true\nfeatures = ["io-util", "time"]\n' >> Cargo.toml
          grep -n 'rqbit\|tokio' Cargo.toml
          set +e
          cargo check --release --features rqbit --message-format short > "$RUNNER_TEMP/rqbit.log" 2>&1
          code=$?
          set -e
          cp "$RUNNER_TEMP/Cargo.toml.main" Cargo.toml
          grep -A1 '^name = "librqbit"$' Cargo.lock || echo "librqbit not resolved"
          # (|| true: with nothing to show grep answers 1, which ended this step as failed in run 43543617161 though
          # cargo check had passed.)
          grep -E 'error|warning' "$RUNNER_TEMP/rqbit.log" | head -150 || true
          tail -5 "$RUNNER_TEMP/rqbit.log"
          echo "cargo check --features rqbit: exit $code" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code
