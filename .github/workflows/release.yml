name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Web build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Package web build
        run: cd dist && zip -r ../KurokawaReader-web.zip . && cd ..
      - uses: actions/upload-artifact@v4
        with: { name: web, path: KurokawaReader-web.zip }

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run build
      - name: Create Android project
        run: npx cap add android && node native/android/overlay.mjs && npx cap sync android
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/kr.keystore
            echo "KR_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KR_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KR_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            # No keystore secret: sign with a generated key so the APK installs (set the secrets for updatable builds).
            keytool -genkeypair -v -keystore $RUNNER_TEMP/kr.keystore -alias kurokawa -keyalg RSA -keysize 2048 -validity 10000 -storepass kurokawa -keypass kurokawa -dname "CN=KurokawaReader, O=Kurokawa, C=SA"
            echo "KR_KEYSTORE_PASSWORD=kurokawa" >> $GITHUB_ENV
            echo "KR_KEY_ALIAS=kurokawa" >> $GITHUB_ENV
            echo "KR_KEY_PASSWORD=kurokawa" >> $GITHUB_ENV
          fi
          echo "KR_KEYSTORE=$RUNNER_TEMP/kr.keystore" >> $GITHUB_ENV
      - name: Build release APKs
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Collect APKs
        run: |
          mkdir -p out
          V=${GITHUB_REF_NAME#v}
          for f in android/app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            abi=$(echo "$base" | sed -E 's/app-(.*)-release.*\.apk/\1/')
            cp "$f" "out/KurokawaReader-$V-$abi.apk"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  ios:
    name: iOS IPA (unsigned, for AltStore / SideStore)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: Create iOS project
        run: npx cap add ios && node native/ios/overlay.mjs && npx cap sync ios
      - name: Archive without signing
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath $RUNNER_TEMP/App.xcarchive archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=app.kurokawa.reader | xcpretty || true
          test -d $RUNNER_TEMP/App.xcarchive/Products/Applications/App.app
      - name: Package IPA
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir -p Payload out
          cp -R $RUNNER_TEMP/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry "out/KurokawaReader-$V-ios-unsigned.ipa" Payload
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: out/*.ipa }

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: Build installer and portable EXE
        shell: bash
        run: |
          cd desktop
          V=${GITHUB_REF_NAME#v}
          npm version "$V" --no-git-tag-version --allow-same-version || true
          npm install
          npx electron-builder --win nsis portable --publish never
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: desktop/out/*.exe }

  release:
    name: Publish release
    needs: [web, android, ios, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Release notes
        run: |
          {
            echo "## KurokawaReader ${GITHUB_REF_NAME}"
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Android (most phones) | \`*-arm64-v8a.apk\` |"
            echo "| Android (older 32-bit phones) | \`*-armeabi-v7a.apk\` |"
            echo "| Android (emulators / x86 tablets) | \`*-x86_64.apk\` |"
            echo "| Android (any, larger) | \`*-universal.apk\` |"
            echo "| Windows | \`*-win-x64.exe\` installer, or the portable \`*.exe\` |"
            echo "| iOS | \`*-ios-unsigned.ipa\` — install with AltStore / SideStore, see below |"
            echo "| Web (self-host) | \`KurokawaReader-web.zip\` |"
            echo
            cat docs/INSTALL.md
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            artifacts/web/*
            artifacts/android/*
            artifacts/ios/*
            artifacts/windows/*
