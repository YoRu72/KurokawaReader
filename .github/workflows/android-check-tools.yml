name: Android compile check (Tools)

# The Android code compiled on a work branch before it reaches a release (the release builds only from main):
# a mistake in the native files is found here, not in a release that then has no APK. What failed is left as a
# comment on the commit.
on:
  workflow_dispatch:
  push:
    branches: ['work-*']
    paths: ['apps/tools/native/android/**', 'apps/tools/tests/native/**', 'apps/tools/capacitor.config.*', 'apps/tools/package.json', '.github/workflows/android-check-tools.yml']

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: apps/tools } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Native tests (downloader, app installer)
        run: sh tests/native/downloader.sh && sh tests/native/apk.sh
      - run: npm install
      - run: npm run build
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create Android project
        shell: bash
        run: |
          set -o pipefail
          { npx cap add android && node native/android/overlay.mjs && npx cap sync android; } 2>&1 | tee $RUNNER_TEMP/prepare.log
      - name: Throw-away signing key (the check signs with it; releases use the repository's)
        run: |
          keytool -genkeypair -v -keystore $RUNNER_TEMP/kt.keystore -alias kurokawa -keyalg RSA -keysize 2048 -validity 30 -storepass kurokawa -keypass kurokawa -dname "CN=check, O=Kurokawa, C=SA" > /dev/null 2>&1
          echo "KR_KEYSTORE=$RUNNER_TEMP/kt.keystore" >> $GITHUB_ENV; echo "KR_KEYSTORE_PASSWORD=kurokawa" >> $GITHUB_ENV; echo "KR_KEY_ALIAS=kurokawa" >> $GITHUB_ENV; echo "KR_KEY_PASSWORD=kurokawa" >> $GITHUB_ENV
      - name: Compile
        shell: bash
        run: |
          set -o pipefail
          # (A release build: R8 runs — a class it strips wrongly, or a rule it rejects, shows here and not on release day.)
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon 2>&1 | tee $RUNNER_TEMP/build.log | grep -vE "^\s*$" | tail -n 150
          ls -la app/build/outputs/apk/release/ | awk '{print $5, $9}'
      - name: Packs and APK contents (the Python pack carries yt-dlp; the APK no yt-dlp, no Picnic tables)
        run: python3 scripts/packs.py $RUNNER_TEMP/packs > /dev/null && python3 scripts/checksize.py $RUNNER_TEMP/packs "$(ls android/app/build/outputs/apk/release/*arm64*.apk | head -1)"
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### Android compile check (Tools) failed"; echo '```'; tail -n 150 $RUNNER_TEMP/build.log | tail -c 50000; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null || true
